name: Bootstrap handoff import integration

on:
  push:
    branches: [feat/handoff-import-roundtrip]
    paths:
      - scripts/ci/bootstrap_handoff_import.py
      - scripts/ci/bootstrap_handoff_source_pairing.py
      - .github/workflows/bootstrap-handoff-import.yml
  pull_request:
    branches: [develop]
    types: [synchronize]
    paths:
      - scripts/ci/bootstrap_handoff_import.py
      - scripts/ci/bootstrap_handoff_source_pairing.py
      - .github/workflows/bootstrap-handoff-import.yml
  workflow_dispatch:

concurrency:
  group: bootstrap-handoff-import-integration
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope'
      && github.actor != 'github-actions[bot]'
      && (
        github.ref_name == 'feat/handoff-import-roundtrip'
        || github.head_ref == 'feat/handoff-import-roundtrip'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/handoff-import-roundtrip
          fetch-depth: 0
          persist-credentials: true

      - name: Use repository Node.js contract
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install lifecycle-disabled dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply reviewed handoff integration and source-pairing invariant
        run: |
          set -euo pipefail
          python3 scripts/ci/bootstrap_handoff_import.py
          python3 scripts/ci/bootstrap_handoff_source_pairing.py

      - name: Verify generated integration and desktop quality gates
        run: |
          set -euo pipefail
          git diff --check
          python3 -m json.tool apps/desktop/src/locales/en/common.json >/dev/null
          python3 -m json.tool apps/desktop/src/locales/ko/common.json >/dev/null
          grep -F 'HandoffImportControl' apps/desktop/src/App.tsx >/dev/null
          grep -F 'pendingHandoff' apps/desktop/src/App.tsx >/dev/null
          grep -F 'setSelectedBootstrap(null);' apps/desktop/src/App.tsx >/dev/null
          grep -F 'requires explicit source re-selection' apps/desktop/src/App.handoff.test.tsx >/dev/null
          grep -F 'slice: ReturnType<typeof vi.fn>' apps/desktop/src/lib/handoff.test.ts >/dev/null
          grep -F 'expect(file.slice).not.toHaveBeenCalled();' apps/desktop/src/lib/handoff.test.ts >/dev/null
          grep -F 'handoffErrorTooLarge' apps/desktop/src/locales/en/common.json >/dev/null
          grep -F 'handoffErrorTooLarge' apps/desktop/src/locales/ko/common.json >/dev/null
          npm run lint --workspace @bandscope/desktop
          npm run typecheck --workspace @bandscope/desktop
          npm test --workspace @bandscope/desktop
          npm run build --workspace @bandscope/desktop
          test ! -e scripts/ci/bootstrap_handoff_import.py
          test ! -e scripts/ci/bootstrap_handoff_source_pairing.py
          test ! -e .github/workflows/bootstrap-handoff-import.yml

      - name: Commit verified integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "feat(desktop): wire handoff import round trip"
          git push origin HEAD:refs/heads/feat/handoff-import-roundtrip
