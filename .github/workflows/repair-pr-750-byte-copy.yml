name: Repair PR 750 validated byte copy

on:
  push:
    branches:
      - fix/score-pdf-byte-validation-clean
    paths:
      - .github/workflows/repair-pr-750-byte-copy.yml

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.ref == 'refs/heads/fix/score-pdf-byte-validation-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: fix/score-pdf-byte-validation-clean
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Execute the bounded test-first repair
        run: python3 .github/scripts/repair_pr_750.py
