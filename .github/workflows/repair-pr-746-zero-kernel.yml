name: Repair PR 746 zero-kernel regression

on:
  push:
    branches:
      - bolt/optimize-segmenter-checkerboard-17097112837352231795
    paths:
      - .github/workflows/repair-pr-746-zero-kernel.yml

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.ref == 'refs/heads/bolt/optimize-segmenter-checkerboard-17097112837352231795'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: bolt/optimize-segmenter-checkerboard-17097112837352231795
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Install dependencies
        run: |
          npm ci
          uv sync --project services/analysis-engine --group dev --frozen
          rustup toolchain install stable --profile minimal
      - name: Commit the failing regression first
        run: |
          cat > services/analysis-engine/tests/test_segmenter_zero_kernel.py <<'PY'
          """Regression coverage for zero-sized checkerboard novelty kernels."""

          from __future__ import annotations

          import numpy as np
          import pytest

          from bandscope_analysis import _native
          from bandscope_analysis.sections.segmenter import _checkerboard_novelty_reference


          def _identity_similarity() -> np.ndarray:
              """Return a deterministic square self-similarity matrix."""
              return np.eye(3, dtype=np.float64)


          def test_checkerboard_reference_zero_kernel_preserves_legacy_zeros() -> None:
              """A zero-sized reference kernel retains the prior all-zero curve."""
              novelty = _checkerboard_novelty_reference(
                  _identity_similarity(), kernel_size=0
              )

              np.testing.assert_array_equal(novelty, np.zeros(3, dtype=np.float64))


          @pytest.mark.skipif(
              not _native.HAVE_RUST or _native._checkerboard_novelty_rust is None,
              reason="Rust numeric extension is not installed",
          )
          def test_checkerboard_native_zero_kernel_matches_reference() -> None:
              """The Rust kernel must not panic or emit an n+1 position for size zero."""
              assert _native._checkerboard_novelty_rust is not None

              novelty = _native._checkerboard_novelty_rust(
                  _identity_similarity(), 0
              )

              np.testing.assert_array_equal(novelty, np.zeros(3, dtype=np.float64))
          PY
          git config user.name "CWL repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/analysis-engine/tests/test_segmenter_zero_kernel.py
          git commit -m "test(segmenter): preserve zero-kernel behavior"
      - name: Prove the regression is red before implementation
        run: |
          set +e
          uv run --project services/analysis-engine pytest -q \
            services/analysis-engine/tests/test_segmenter_zero_kernel.py::test_checkerboard_reference_zero_kernel_preserves_legacy_zeros
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the zero-kernel regression to fail before the production guard" >&2
            exit 1
          fi
      - name: Apply the minimal Python and Rust guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          python_path = Path("services/analysis-engine/src/bandscope_analysis/sections/segmenter.py")
          python_text = python_path.read_text(encoding="utf-8")
          old_python = "    if n < kernel_size:\n        return novelty\n"
          new_python = "    if kernel_size == 0 or n < kernel_size:\n        return novelty\n"
          if python_text.count(old_python) != 1:
              raise SystemExit("unexpected Python zero-window guard shape")
          python_path.write_text(python_text.replace(old_python, new_python), encoding="utf-8")

          rust_path = Path("services/analysis-engine/rust/src/lib.rs")
          rust_text = rust_path.read_text(encoding="utf-8")
          old_rust = (
              "    // Mirror the Python guard: matrices smaller than the kernel yield zeros.\n"
              "    if n < kernel_size {\n"
          )
          new_rust = (
              "    // Preserve the legacy all-zero curve for a zero-sized kernel; matrices\n"
              "    // smaller than a nonzero kernel likewise have no valid diagonal patch.\n"
              "    if kernel_size == 0 || n < kernel_size {\n"
          )
          if rust_text.count(old_rust) != 1:
              raise SystemExit("unexpected Rust zero-window guard shape")
          rust_path.write_text(rust_text.replace(old_rust, new_rust), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog_text = changelog_path.read_text(encoding="utf-8")
          old_changelog = (
              "- Optimized `_checkerboard_novelty_reference` by replacing Python inner loops "
              "with a vectorized NumPy `sliding_window_view` and `einsum` implementation for "
              "fallback parity, preserving the Rust kernel as the production arithmetic path."
          )
          new_changelog = (
              old_changelog
              + " Zero-sized kernels retain the prior all-zero curve instead of entering an "
              "invalid `n + 1` window range."
          )
          if changelog_text.count(old_changelog) != 1:
              raise SystemExit("unexpected checkerboard changelog entry")
          changelog_path.write_text(
              changelog_text.replace(old_changelog, new_changelog), encoding="utf-8"
          )
          PY
          cargo +stable fmt --manifest-path services/analysis-engine/rust/Cargo.toml --check
      - name: Build the native kernel and verify focused parity
        run: |
          VENV_PY="$PWD/services/analysis-engine/.venv/bin/python"
          uvx maturin@1.9.6 build --release \
            --manifest-path services/analysis-engine/rust/Cargo.toml \
            --interpreter "$VENV_PY" \
            --out services/analysis-engine/rust/dist
          uv pip install --python "$VENV_PY" services/analysis-engine/rust/dist/*.whl
          uv run --project services/analysis-engine pytest -q \
            services/analysis-engine/tests/test_segmenter_zero_kernel.py \
            services/analysis-engine/tests/test_segmenter.py \
            services/analysis-engine/tests/test_segmenter_short_reference.py \
            services/analysis-engine/tests/test_numeric_parity.py
          cargo +stable test --manifest-path services/analysis-engine/rust/Cargo.toml --locked
      - name: Verify the repository gate and commit the repair
        run: |
          ./scripts/harness/quickcheck.sh
          rm .github/workflows/repair-pr-746-zero-kernel.yml
          git add CHANGELOG.md \
            services/analysis-engine/rust/src/lib.rs \
            services/analysis-engine/src/bandscope_analysis/sections/segmenter.py \
            services/analysis-engine/tests/test_segmenter_zero_kernel.py \
            .github/workflows/repair-pr-746-zero-kernel.yml
          git commit -m "fix(segmenter): guard zero-size novelty kernels"
          git push origin HEAD:bolt/optimize-segmenter-checkerboard-17097112837352231795
