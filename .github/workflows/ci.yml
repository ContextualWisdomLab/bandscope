name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  verify:
    name: ci / build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Install node dependencies
        run: npm ci
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Run quickcheck
        run: ./scripts/harness/quickcheck.sh

  rust-check:
    name: gate / ci / rust-check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build --workspace @bandscope/desktop
      - name: Check Tauri shell
        run: cargo +stable check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
