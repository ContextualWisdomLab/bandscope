[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bandscope-analysis"
version = "0.1.0"
description = "BandScope local-first analysis engine"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "librosa>=0.11.0",
    "numba<0.67.0",
    "numpy>=1.26",
    "soundfile>=0.13.1",
            "urllib3>=2.7.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
  "bandit>=1.7.7",
  "mypy>=1.15.0",
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]

# Security constraint for a transitive dependency (pulled in via torch/demucs).
# setuptools < 83.0.0 is affected by CVE-2026-59890 (MEDIUM): MANIFEST.in
# exclude/prune globs are matched without Unicode normalization, so an NFD file
# name can bypass an NFC exclusion rule on macOS APFS/HFS+. A constraint pins the
# resolved version without adding setuptools as a runtime dependency.
[tool.uv]
constraint-dependencies = ["setuptools>=83.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/bandscope_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/bandscope_analysis"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The optional Rust extension ships no type stubs / py.typed marker, and may be
# absent entirely (the engine falls back to the Python reference kernels).
[[tool.mypy.overrides]]
module = ["bandscope_numeric"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
