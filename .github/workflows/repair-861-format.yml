name: Repair PR 861 Python formatting

on:
  push:
    branches:
      - test/enforce-python-branch-coverage
    paths:
      - .github/workflows/repair-861-format.yml

permissions:
  contents: write

jobs:
  format-python:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout contributor branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: test/enforce-python-branch-coverage
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: '0.8.6'
          enable-cache: false
      - name: Sync analysis development dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Apply repository Ruff formatter
        run: |
          cd services/analysis-engine
          uv run ruff format src/bandscope_analysis/roles/activity.py tests/test_branch_coverage_contract.py
      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-861-format.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/analysis-engine/src/bandscope_analysis/roles/activity.py services/analysis-engine/tests/test_branch_coverage_contract.py .github/workflows/repair-861-format.yml
          if git diff --cached --quiet; then
            echo 'Formatter produced no tree change; refusing to leave repair workflow behind.' >&2
            exit 1
          fi
          git commit -m 'style: apply repository Python formatter'
          git push origin HEAD:test/enforce-python-branch-coverage
