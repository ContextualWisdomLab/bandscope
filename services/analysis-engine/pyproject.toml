[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bandscope-analysis"
version = "0.1.0"
description = "BandScope local-first analysis engine"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "librosa>=0.11.0",
    "numba<0.67.0",
    "numpy>=1.26",
    "soundfile>=0.13.1",
            "urllib3>=2.7.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
  "bandit>=1.7.7",
  "markdown-it-py==4.0.0",
  "mypy>=1.15.0",
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bandscope_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "youtube_stem_e2e: opt-in network and real-model validation against a known public stem",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/bandscope_analysis"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The optional Rust extension ships no type stubs / py.typed marker, and may be
# absent entirely (the engine falls back to the Python reference kernels).
[[tool.mypy.overrides]]
module = ["bandscope_numeric"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
