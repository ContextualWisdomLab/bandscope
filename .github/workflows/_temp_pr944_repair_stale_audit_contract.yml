name: Temporary PR 944 stale Rust audit contract repair

on:
  push:
    branches:
      - agent/rust-toolchain-refresh-2026-08-19
    paths:
      - .github/workflows/_temp_pr944_repair_stale_audit_contract.yml
      - scripts/checks/_temp_pr944_repair_stale_audit_contract.py

permissions:
  contents: write

concurrency:
  group: temp-pr944-stale-rust-audit-contract
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor_id == '8172694'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head without persisted write credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up repository-pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Verify live writer head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/rust-toolchain-refresh-2026-08-19
          test "$(git rev-parse origin/agent/rust-toolchain-refresh-2026-08-19)" = "$GITHUB_SHA"
      - name: Apply bounded owner repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/checks/_temp_pr944_repair_stale_audit_contract.py
          git diff --check
          test "$(git diff --name-only)" = 'services/analysis-engine/tests/test_supply_chain_policy.py'
      - name: Install locked analysis-engine development dependencies
        shell: bash
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Verify seven stale-contract regressions
        shell: bash
        run: |
          set -euo pipefail
          test_file='services/analysis-engine/tests/test_supply_chain_policy.py'
          uv run --project services/analysis-engine pytest \
            "$test_file::test_security_audit_workflow_keeps_dependency_vulnerability_scans" \
            "$test_file::test_supply_chain_check_requires_audit_tokens_in_run_steps" \
            "$test_file::test_supply_chain_check_accepts_nested_shell_audit_commands" \
            "$test_file::test_supply_chain_check_rejects_noop_audit_command_spoofs" \
            "$test_file::test_supply_chain_check_requires_blocking_audit_steps" \
            "$test_file::test_supply_chain_check_requires_unconditional_audit_steps" \
            "$test_file::test_supply_chain_check_accepts_explicit_false_continue_on_error_audit_steps"
          uv run --project services/analysis-engine ruff check "$test_file"
          uv run --project services/analysis-engine ruff format --check "$test_file"
      - name: Publish repaired test contract and remove transition machinery
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add services/analysis-engine/tests/test_supply_chain_policy.py
          git rm \
            .github/workflows/_temp_pr944_repair_stale_audit_contract.yml \
            scripts/checks/_temp_pr944_repair_stale_audit_contract.py
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/_temp_pr944_repair_stale_audit_contract.yml\nscripts/checks/_temp_pr944_repair_stale_audit_contract.py\nservices/analysis-engine/tests/test_supply_chain_policy.py'
          git config user.name 'ContextualWisdomLab repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(policy): align Rust audit regression contract'
          git fetch origin agent/rust-toolchain-refresh-2026-08-19
          test "$(git rev-parse origin/agent/rust-toolchain-refresh-2026-08-19)" = "$GITHUB_SHA"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push https://github.com/ContextualWisdomLab/bandscope.git HEAD:agent/rust-toolchain-refresh-2026-08-19
