name: Finalize checkerboard vectorization

on:
  push:
    branches: [bolt/optimize-segmenter-checkerboard-17097112837352231795]
    paths:
      - scripts/ci/finalize_checkerboard_vectorization.py
      - .github/workflows/finalize-checkerboard-vectorization.yml
  workflow_dispatch:

concurrency:
  group: finalize-checkerboard-vectorization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope'
      && github.actor != 'github-actions[bot]'
      && github.ref_name == 'bolt/optimize-segmenter-checkerboard-17097112837352231795'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: bolt/optimize-segmenter-checkerboard-17097112837352231795
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Python environment
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false

      - name: Sync analysis dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build and install numeric extension
        run: |
          set -euo pipefail
          python_path="$PWD/services/analysis-engine/.venv/bin/python"
          uvx maturin@1.9.6 build --release \
            --manifest-path services/analysis-engine/rust/Cargo.toml \
            --interpreter "$python_path" \
            --out services/analysis-engine/rust/dist
          uv pip install --python "$python_path" services/analysis-engine/rust/dist/*.whl

      - name: Apply reviewed vectorization and remove unrelated drift
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/finalize_checkerboard_vectorization.py
          python3 scripts/ci/finalize_checkerboard_vectorization.py
          git show acdbea6344fe1231c39535b575f4de35e4c607c9:.jules/bolt.md > .jules/bolt.md
          git show acdbea6344fe1231c39535b575f4de35e4c607c9:package-lock.json > package-lock.json
          rm .github/workflows/finalize-checkerboard-vectorization.yml

      - name: Verify independent oracle and Rust parity
        run: |
          set -euo pipefail
          git diff --check
          uv run --project services/analysis-engine pytest -q \
            services/analysis-engine/tests/test_segmenter.py \
            services/analysis-engine/tests/test_numeric_parity.py
          uv run --project services/analysis-engine ruff check \
            services/analysis-engine/src/bandscope_analysis/sections/segmenter.py \
            services/analysis-engine/tests/test_segmenter.py
          uv run --project services/analysis-engine mypy \
            services/analysis-engine/src/bandscope_analysis/sections/segmenter.py
          cargo +stable test --manifest-path services/analysis-engine/rust/Cargo.toml --locked
          grep -F 'out=novelty[half : n - half]' \
            services/analysis-engine/src/bandscope_analysis/sections/segmenter.py >/dev/null
          grep -F 'Vectorization preserves even, odd, unit, and boundary-size kernels.' \
            services/analysis-engine/tests/test_segmenter.py >/dev/null
          cmp package-lock.json <(git show acdbea6344fe1231c39535b575f4de35e4c607c9:package-lock.json)
          cmp .jules/bolt.md <(git show acdbea6344fe1231c39535b575f4de35e4c607c9:.jules/bolt.md)
          test ! -e scripts/ci/finalize_checkerboard_vectorization.py
          test ! -e .github/workflows/finalize-checkerboard-vectorization.yml

      - name: Commit verified final state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No checkerboard changes to commit."
            exit 0
          fi
          git commit -m "perf(segmenter): verify bounded checkerboard vectorization"
          git push origin HEAD:refs/heads/bolt/optimize-segmenter-checkerboard-17097112837352231795
