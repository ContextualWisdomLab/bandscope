name: Repair PR 811 explicit argument dispatch

on:
  push:
    branches:
      - fix-cli-unbounded-read-5165758910965089497
    paths:
      - .github/workflows/repair-pr-811-argument-dispatch.yml

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.ref == 'refs/heads/fix-cli-unbounded-read-5165758910965089497'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: fix-cli-unbounded-read-5165758910965089497
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Execute bounded test-first repair
        run: python3 .github/scripts/repair_pr_811.py
