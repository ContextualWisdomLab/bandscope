name: Bootstrap naruon canonical order

on:
  push:
    branches: [feat/naruon-rehearsal-handoff-v1]
    paths:
      - scripts/ci/bootstrap_naruon_canonical_order.py
      - .github/workflows/bootstrap-naruon-canonical-order.yml
  pull_request:
    branches: [develop]
    types: [synchronize]
    paths:
      - scripts/ci/bootstrap_naruon_canonical_order.py
      - .github/workflows/bootstrap-naruon-canonical-order.yml
  workflow_dispatch:

concurrency:
  group: bootstrap-naruon-canonical-order
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope'
      && github.actor != 'github-actions[bot]'
      && (
        github.ref_name == 'feat/naruon-rehearsal-handoff-v1'
        || github.head_ref == 'feat/naruon-rehearsal-handoff-v1'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/naruon-rehearsal-handoff-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed canonicalization fix
        run: python3 scripts/ci/bootstrap_naruon_canonical_order.py

      - name: Verify deterministic field construction
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'workspaceId: source.workspaceId' packages/shared-types/src/naruon.ts >/dev/null
          grep -F 'rsvpDirection: commitment.rsvpDirection' packages/shared-types/src/naruon.ts >/dev/null
          grep -F 'field: receipt.field' packages/shared-types/src/naruon.ts >/dev/null
          grep -F 'produces identical serialization regardless of input key insertion order' packages/shared-types/test/naruon.test.ts >/dev/null
          test ! -e scripts/ci/bootstrap_naruon_canonical_order.py
          test ! -e .github/workflows/bootstrap-naruon-canonical-order.yml

      - name: Commit generated fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No canonicalization changes to commit."
            exit 0
          fi
          git commit -m "fix(naruon): canonicalize nested serialization order"
          git push origin HEAD:refs/heads/feat/naruon-rehearsal-handoff-v1
