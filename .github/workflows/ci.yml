name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  verify:
    name: ci / build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Install node dependencies
        run: npm ci
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Run quickcheck
        run: ./scripts/harness/quickcheck.sh

  rust-check:
    name: gate / ci / rust-check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build --workspace @bandscope/desktop
      - name: Check Tauri shell
        run: cargo +stable check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
