name: Repair PR 744 canonical npm lock

on:
  push:
    branches:
      - feat/i18n-workspace-buttons-12938137214845538471
    paths:
      - .github/workflows/repair-pr744-canonical-lock.yml

concurrency:
  group: repair-pr744-canonical-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Restore the protected-base lock and apply bounded pins
        env:
          EXPECTED_PARENT_SHA: 213ae6aeb686ca0ebba6af4ec7ab30042593d058
          BASE_SHA: acdbea6344fe1231c39535b575f4de35e4c607c9
          WORKFLOW_PATH: .github/workflows/repair-pr744-canonical-lock.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT_SHA"...HEAD)" = "$WORKFLOW_PATH"
          git show "$BASE_SHA:package-lock.json" > package-lock.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          packages = lock.get("packages")
          if lock.get("lockfileVersion") != 3 or not isinstance(packages, dict):
              raise SystemExit("expected a lockfileVersion 3 packages map")

          react_dom_path = "apps/desktop/node_modules/@types/react-dom"
          react_dom = packages.get(react_dom_path)
          if not isinstance(react_dom, dict) or react_dom.get("version") != "19.2.3":
              raise SystemExit("unexpected @types/react-dom workspace entry")
          react_dom["resolved"] = (
              "https://registry.npmjs.org/@types/react-dom/-/react-dom-19.2.3.tgz"
          )
          react_dom["integrity"] = (
              "sha512-jp2L/eY6fn+KgVVQAOqYItbF0VY/YApe5Mz2F0aykSO8gx31bYCZyvSeYxCHKvzHG5eZjc+zyaS5BrBWya2+kQ=="
          )

          undici = packages.get("node_modules/undici")
          if not isinstance(undici, dict) or undici.get("version") != "7.28.0":
              raise SystemExit("unexpected protected-base Undici entry")
          undici.update(
              {
                  "version": "7.29.0",
                  "resolved": "https://registry.npmjs.org/undici/-/undici-7.29.0.tgz",
                  "integrity": "sha512-IDxfleLmmbSskfWSUATiN1nfn2rDuvnMOqb5CWR92iIfojA0Ud+ulOAAEQ57LPr9rWmsreUyf5lwyao+7GNNVw==",
              }
          )

          sri = re.compile(r"^sha512-[A-Za-z0-9+/]{86}==$")
          missing = []
          for package_path, metadata in sorted(packages.items()):
              if not package_path or "node_modules" not in package_path.split("/"):
                  continue
              if not isinstance(metadata, dict):
                  raise SystemExit(f"malformed metadata for {package_path}")
              if metadata.get("link") is True or metadata.get("inBundle") is True:
                  continue
              resolved = metadata.get("resolved")
              integrity = metadata.get("integrity")
              if not (
                  isinstance(resolved, str)
                  and resolved.startswith("https://registry.npmjs.org/")
                  and resolved.endswith(".tgz")
                  and isinstance(integrity, str)
                  and sri.fullmatch(integrity)
              ):
                  missing.append(package_path)
          if missing:
              raise SystemExit(
                  "unbounded non-link, non-bundled lock entries remain: "
                  + ", ".join(missing[:20])
              )

          lock_path.write_text(
              json.dumps(lock, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          python3 - <<'PY'
          import json
          import subprocess

          base = json.loads(
              subprocess.check_output(
                  ["git", "show", "acdbea6344fe1231c39535b575f4de35e4c607c9:package-lock.json"],
                  text=True,
              )
          )
          head = json.load(open("package-lock.json", encoding="utf-8"))
          changed = {
              key
              for key in set(base["packages"]) | set(head["packages"])
              if base["packages"].get(key) != head["packages"].get(key)
          }
          expected = {
              "apps/desktop/node_modules/@types/react-dom",
              "node_modules/undici",
          }
          if changed != expected:
              raise SystemExit(f"unexpected lock package drift: {sorted(changed)}")
          PY

          git diff --check

      - name: Verify canonical workspace installation and product contracts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --workspaces --audit-level=high
          npm --workspace apps/desktop run lint
          npm --workspace apps/desktop run typecheck
          npm --workspace apps/desktop test
          npm --workspace apps/desktop run build

      - name: Commit the verified final tree
        env:
          BASE_SHA: acdbea6344fe1231c39535b575f4de35e4c607c9
          WORKFLOW_PATH: .github/workflows/repair-pr744-canonical-lock.yml
        run: |
          set -euo pipefail
          rm "$WORKFLOW_PATH"
          git add package-lock.json "$WORKFLOW_PATH"
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "$WORKFLOW_PATH" package-lock.json | sort)"
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(deps): restore canonical hash-bounded npm lock"
          final_files="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          expected_files="$(printf '%s\n' \
            CHANGELOG.md \
            apps/desktop/src/features/workspace/Workspace.test.tsx \
            apps/desktop/src/features/workspace/Workspace.tsx \
            apps/desktop/src/i18n/index.test.ts \
            apps/desktop/src/i18n/index.ts \
            apps/desktop/src/locales/en/common.json \
            apps/desktop/src/locales/ko/common.json \
            package-lock.json | sort)"
          test "$final_files" = "$expected_files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
