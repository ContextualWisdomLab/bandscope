name: Repair PR 811 explicit argument dispatch

on:
  push:
    branches:
      - fix-cli-unbounded-read-5165758910965089497
    paths:
      - .github/workflows/repair-pr-811-argument-dispatch.yml

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.ref == 'refs/heads/fix-cli-unbounded-read-5165758910965089497'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: fix-cli-unbounded-read-5165758910965089497
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Install node dependencies
        run: npm ci
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build and install Rust numeric extension
        run: |
          uv sync --project services/analysis-engine --group dev --frozen
          VENV_PY="$PWD/services/analysis-engine/.venv/bin/python"
          uvx maturin@1.9.6 build --release \
            --manifest-path services/analysis-engine/rust/Cargo.toml \
            --interpreter "$VENV_PY" \
            --out services/analysis-engine/rust/dist
          uv pip install --python "$VENV_PY" services/analysis-engine/rust/dist/*.whl
      - name: Execute formatted test-first repair with native parity environment
        run: python3 .github/scripts/repair_pr_811.py
