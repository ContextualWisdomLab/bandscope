name: security-audit

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.8.6"
      - name: Install node dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --workspaces --audit-level=high
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.8.0
      - name: Export Python lock for audit
        working-directory: services/analysis-engine
        run: uv export --frozen --no-emit-project --format requirements-txt --no-hashes --output-file requirements-audit.txt
      - name: Audit Python dependencies
        working-directory: services/analysis-engine
        run: python -m pip_audit -r requirements-audit.txt --strict
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo +stable audit
