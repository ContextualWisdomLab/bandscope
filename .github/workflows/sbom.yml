name: sbom

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  supplemental-inventory:
    name: supply-chain-inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate supply-chain inventory baseline
        run: python3 scripts/checks/verify_supply_chain.py

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs:
      - supplemental-inventory
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: bandscope-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandscope-sbom
          path: bandscope-sbom.cdx.json

      - name: Upload supplemental inventory artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandscope-supply-chain-inventory
          path: supply-chain/supplemental-component-inventory.json
