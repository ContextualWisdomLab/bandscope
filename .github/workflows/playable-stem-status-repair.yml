name: playable-stem-status-repair

on:
  push:
    branches:
      - feat/playable-stem-audition-961
    paths:
      - scripts/repairs/apply_playable_stem_status.py
      - .github/workflows/playable-stem-status-repair.yml

permissions:
  contents: write

concurrency:
  group: playable-stem-status-repair-${{ github.repository }}-1159
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Verify exact branch identity
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "feat/playable-stem-audition-961"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply exact source repair
        run: python scripts/repairs/apply_playable_stem_status.py
      - name: Sync locked Python environment
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Run focused playable-stem tests
        run: |
          uv run --project services/analysis-engine pytest \
            services/analysis-engine/tests/test_playback_artifacts.py \
            services/analysis-engine/tests/test_playback_artifact_exports.py \
            services/analysis-engine/tests/test_playback_artifact_reference.py \
            services/analysis-engine/tests/test_playback_artifact_status.py \
            -q
      - name: Run complete analysis-engine coverage
        run: |
          uv run --project services/analysis-engine pytest \
            services/analysis-engine/tests \
            --cov=services/analysis-engine/src/bandscope_analysis \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
      - name: Run Python quality gates
        run: |
          uv run --project services/analysis-engine ruff check \
            services/analysis-engine/src services/analysis-engine/tests
          uv run --project services/analysis-engine ruff format --check \
            services/analysis-engine/src services/analysis-engine/tests
          uv run --project services/analysis-engine mypy \
            services/analysis-engine/src
          python -m compileall -q services/analysis-engine/src services/analysis-engine/tests
          git diff --check
      - name: Remove completed repair machinery
        run: |
          rm scripts/repairs/apply_playable_stem_status.py
          rm .github/workflows/playable-stem-status-repair.yml
      - name: Commit verified source repair
        shell: bash
        run: |
          git config user.name "bandscope-repair-bot"
          git config user.email "bandscope-repair-bot@users.noreply.github.com"
          git add \
            services/analysis-engine/src/bandscope_analysis/api.py \
            services/analysis-engine/tests/test_playback_artifact_status.py \
            scripts/repairs/apply_playable_stem_status.py \
            .github/workflows/playable-stem-status-repair.yml
          git diff --cached --quiet && { echo "No verified repair delta was produced." >&2; exit 1; }
          git commit -m "feat(api): attach path-free playable stem status"
          git push origin HEAD:feat/playable-stem-audition-961
