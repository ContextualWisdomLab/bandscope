name: Fix naruon lint

on:
  push:
    branches: [feat/naruon-rehearsal-handoff-v1]
    paths:
      - scripts/ci/fix_naruon_lint.py
      - .github/workflows/fix-naruon-lint.yml
  pull_request:
    branches: [develop]
    types: [synchronize]
    paths:
      - scripts/ci/fix_naruon_lint.py
      - .github/workflows/fix-naruon-lint.yml
  workflow_dispatch:

concurrency:
  group: fix-naruon-lint
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope'
      && github.actor != 'github-actions[bot]'
      && (
        github.ref_name == 'feat/naruon-rehearsal-handoff-v1'
        || github.head_ref == 'feat/naruon-rehearsal-handoff-v1'
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/naruon-rehearsal-handoff-v1
          fetch-depth: 0

      - name: Use repository Node.js contract
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install lifecycle-disabled dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply reviewed lint fix
        run: python3 scripts/ci/fix_naruon_lint.py

      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          npm run lint --workspace @bandscope/shared-types
          npm run typecheck --workspace @bandscope/shared-types
          npm test --workspace @bandscope/shared-types
          test ! -e scripts/ci/fix_naruon_lint.py
          test ! -e .github/workflows/fix-naruon-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(integration): satisfy naruon lint contract"
          git push origin HEAD:refs/heads/feat/naruon-rehearsal-handoff-v1
