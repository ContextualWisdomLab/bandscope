name: repair-828-security-baseline

on:
  push:
    branches:
      - feature/youtube-known-stem-e2e

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout contributor branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/youtube-known-stem-e2e
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: '0.8.6'
          enable-cache: false

      - name: Remove duplicated canonical npm-baseline test
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          test_path = Path('services/analysis-engine/tests/test_supply_chain_policy.py')
          source = test_path.read_text(encoding='utf-8')
          start_marker = 'def test_node_security_floors_are_locked_to_patched_versions() -> None:\n'
          end_marker = 'def test_supplemental_inventory_rejects_obsolete_or_missing_runtime_model(\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('expected exactly one duplicate npm-baseline test block')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          source = source[:start] + source[end:]
          test_path.write_text(source, encoding='utf-8')

          desktop = json.loads(Path('apps/desktop/package.json').read_text(encoding='utf-8'))
          if desktop['dependencies']['pdfjs-dist'] != '6.1.200':
              raise SystemExit('branch must defer JavaScript baseline remediation to canonical #783')
          PY

      - name: Verify bounded supply-chain policy tests
        shell: bash
        run: |
          uv sync --project services/analysis-engine --frozen
          uv run --project services/analysis-engine pytest services/analysis-engine/tests/test_supply_chain_policy.py -q

      - name: Self-delete and push bounded repair
        shell: bash
        run: |
          rm .github/workflows/repair-828-security-baseline.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/analysis-engine/tests/test_supply_chain_policy.py .github/workflows/repair-828-security-baseline.yml
          git commit -m 'test(supply-chain): defer shared npm floor to #783'
          git push origin HEAD:feature/youtube-known-stem-e2e
