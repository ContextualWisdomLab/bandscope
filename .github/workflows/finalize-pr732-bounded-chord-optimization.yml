name: Finalize PR 732 bounded chord optimization

on:
  push:
    branches: [jules-15985039724708397070-07b0954f]
    paths:
      - .github/workflows/finalize-pr732-bounded-chord-optimization.yml

permissions:
  contents: read

concurrency:
  group: finalize-pr732-bounded-chord-optimization
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: error

jobs:
  test-repair-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/jules-15985039724708397070-07b0954f'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.8.6'
          enable-cache: false

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install locked dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          npm ci
          uv sync --project services/analysis-engine --group dev --frozen

      - name: Add real-song-duration and independent-oracle regressions
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('services/analysis-engine/tests/test_chord_recognizer_opt.py')
          source = path.read_text(encoding='utf-8')
          if 'test_recognize_has_no_arbitrary_song_duration_cutoff' in source:
              raise SystemExit('bounded cleanup regressions already exist unexpectedly')
          addition = dedent(
              '''


              def _observation_probability_oracle(
                  chromagram: np.ndarray,
                  similarity: np.ndarray,
                  rms: np.ndarray,
              ) -> np.ndarray:
                  """Build frame probabilities with an independent scalar implementation."""

                  n_frames = chromagram.shape[1]
                  expected = np.zeros((25, n_frames), dtype=np.float64)
                  for frame in range(n_frames):
                      if frame < similarity.shape[1]:
                          scores = similarity[:, frame]
                          shifted = scores - float(np.max(scores))
                          weights = np.exp(shifted * 2.0)
                          chord_probabilities = weights / (float(np.sum(weights)) + 1e-12)
                          maximum_similarity = float(np.max(scores))
                      else:
                          chord_probabilities = np.full(24, 1.0 / 24.0)
                          maximum_similarity = 1.0

                      rms_value = float(rms[frame]) if frame < len(rms) else 1.0
                      low_signal = (
                          maximum_similarity < 0.3
                          or rms_value < 0.01
                          or float(np.var(chromagram[:, frame])) < 0.02
                      )
                      if low_signal:
                          chord_probabilities = chord_probabilities * 0.1
                          no_chord_probability = 0.9
                      else:
                          no_chord_probability = 0.05
                      column = np.concatenate(
                          (chord_probabilities, np.array([no_chord_probability]))
                      )
                      expected[:, frame] = column / (float(np.sum(column)) + 1e-12)
                  return expected


              @pytest.mark.parametrize(
                  ("similarity_frames", "rms_frames"),
                  [(0, 0), (3, 2), (8, 8), (12, 10)],
              )
              def test_observation_probabilities_match_independent_scalar_oracle(
                  similarity_frames: int,
                  rms_frames: int,
              ) -> None:
                  """Vectorized mismatch handling preserves frame-level probability semantics."""

                  recognizer = ChordRecognizer()
                  rng = np.random.default_rng(700 + similarity_frames * 10 + rms_frames)
                  chromagram = rng.random((12, 8), dtype=np.float64)
                  similarity = rng.random((24, similarity_frames), dtype=np.float64)
                  rms = rng.random(rms_frames, dtype=np.float64)

                  np.testing.assert_allclose(
                      recognizer._build_observation_probs(chromagram, similarity, rms),
                      _observation_probability_oracle(chromagram, similarity, rms),
                      rtol=1e-12,
                      atol=1e-12,
                  )


              def _dense_viterbi_oracle(
                  recognizer: ChordRecognizer,
                  observation_probs: np.ndarray,
              ) -> np.ndarray:
                  """Decode with the former dense score table as an independent oracle."""

                  n_states, n_frames = observation_probs.shape
                  if n_frames == 0:
                      return np.array([], dtype=np.intp)
                  log_transition = np.log(recognizer._transition_matrix + 1e-12)
                  log_observation = np.log(observation_probs + 1e-12)
                  scores = np.zeros((n_states, n_frames), dtype=np.float64)
                  backpointer = np.zeros((n_states, n_frames), dtype=np.intp)
                  scores[:, 0] = np.log(1.0 / n_states) + log_observation[:, 0]
                  for frame in range(1, n_frames):
                      transitions = scores[:, frame - 1, np.newaxis] + log_transition
                      backpointer[:, frame] = np.argmax(transitions, axis=0)
                      scores[:, frame] = np.max(transitions, axis=0) + log_observation[:, frame]
                  states = np.zeros(n_frames, dtype=np.intp)
                  states[-1] = int(np.argmax(scores[:, -1]))
                  for frame in range(n_frames - 2, -1, -1):
                      states[frame] = backpointer[states[frame + 1], frame + 1]
                  return states


              @pytest.mark.parametrize("n_frames", [0, 1, 7, 31])
              def test_rolling_viterbi_scores_match_dense_oracle(n_frames: int) -> None:
                  """The O(states) score vector preserves the former exact decoded path."""

                  recognizer = ChordRecognizer()
                  rng = np.random.default_rng(900 + n_frames)
                  observations = rng.random((25, n_frames), dtype=np.float64)
                  if n_frames:
                      observations /= observations.sum(axis=0, keepdims=True)

                  np.testing.assert_array_equal(
                      recognizer._viterbi_decode_reference(observations),
                      _dense_viterbi_oracle(recognizer, observations),
                  )


              def test_recognize_has_no_arbitrary_song_duration_cutoff(monkeypatch) -> None:
                  """Long-form rehearsal recordings follow the normal bounded DSP pipeline."""

                  recognizer = ChordRecognizer()
                  audio = np.ones(301, dtype=np.float32)
                  chromagram = np.ones((12, 1), dtype=np.float64)
                  expected = [
                      {
                          "start_time": 0.0,
                          "end_time": 301.0,
                          "chord": "C",
                          "confidence": "high",
                      }
                  ]
                  monkeypatch.setattr(recognizer, '_separate_harmonic', lambda value: value)
                  monkeypatch.setattr(
                      recognizer,
                      '_extract_chromagram',
                      lambda _value, _sampling_rate: chromagram,
                  )
                  monkeypatch.setattr(
                      recognizer,
                      '_calculate_rms',
                      lambda _value, _frame_count: np.ones(1),
                  )
                  monkeypatch.setattr(
                      recognizer,
                      '_match_templates',
                      lambda _chroma: (np.ones((24, 1)), np.zeros(1, dtype=np.intp)),
                  )
                  monkeypatch.setattr(
                      recognizer,
                      '_create_chord_segments',
                      lambda *_args: expected,
                  )

                  assert recognizer.recognize(audio, sr=1) == expected
              '''
          )
          path.write_text(source.rstrip() + addition + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Prove the arbitrary five-minute rejection is red
        shell: bash --noprofile --norc {0}
        working-directory: services/analysis-engine
        run: |
          set +e
          .venv/bin/python -m pytest -q \
            tests/test_chord_recognizer_opt.py::test_recognize_has_no_arbitrary_song_duration_cutoff
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo '::error::Long-form recording regression passed before cleanup.'
            exit 1
          fi
          printf 'Observed expected pre-fix failure (exit %s).\n' "$status"

      - name: Apply focused production and lock cleanup
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          source_path = Path(
              'services/analysis-engine/src/bandscope_analysis/chords/chord_recognizer.py'
          )
          source = source_path.read_text(encoding='utf-8')
          duration_block = '''        # Maximum allowed audio length: 300 seconds (5 minutes)
                  max_duration_seconds = 300
                  max_samples = max_duration_seconds * sr
                  if len(y) > max_samples:
                      raise ValueError(
                          f"Audio length exceeds maximum allowed duration of {max_duration_seconds} seconds."
                      )
          '''.replace('          ', '')
          if source.count(duration_block) != 1:
              raise SystemExit('arbitrary duration block is not unique')
          source_path.write_text(source.replace(duration_block, '', 1), encoding='utf-8')

          test_path = Path('services/analysis-engine/tests/test_chord_recognizer_opt.py')
          tests = test_path.read_text(encoding='utf-8')
          obsolete = '''

              def test_recognize_rejects_oversized_audio():
                  """Reject audio longer than the maximum allowed duration."""
                  recognizer = ChordRecognizer()
                  sr = 22050
                  # 301 seconds of audio
                  y = np.zeros(301 * sr, dtype=np.float32)
                  with pytest.raises(ValueError, match="Audio length exceeds maximum"):
                      recognizer.recognize(y, sr=sr)
          '''.replace('          ', '')
          if tests.count(obsolete) != 1:
              raise SystemExit('obsolete oversized-audio test is not unique')
          test_path.write_text(tests.replace(obsolete, '', 1), encoding='utf-8')

          base_lock = subprocess.check_output(
              ['git', 'show', 'origin/develop:package-lock.json'], text=True
          )
          lock = json.loads(base_lock)
          undici = lock['packages']['node_modules/undici']
          if undici.get('version') != '7.28.0':
              raise SystemExit('protected-base Undici version changed')
          undici.update(
              {
                  'version': '7.29.0',
                  'resolved': 'https://registry.npmjs.org/undici/-/undici-7.29.0.tgz',
                  'integrity': 'sha512-IDxfleLmmbSskfWSUATiN1nfn2rDuvnMOqb5CWR92iIfojA0Ud+ulOAAEQ57LPr9rWmsreUyf5lwyao+7GNNVw==',
              }
          )
          Path('package-lock.json').write_text(
              json.dumps(lock, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          note = (
              '### Changed\n\n'
              '- Vectorized frame-aligned chord observations and reduced the NumPy '
              'Viterbi parity oracle to one rolling score vector while preserving '
              'neutral missing-evidence semantics, long-form rehearsal recordings, '
              'and exact dense-oracle paths.\n\n'
          )
          release_marker = '## [0.1.3] - 2026-04-29\n'
          if note not in changelog:
              if changelog.count(release_marker) != 1:
                  raise SystemExit('changelog release marker is not unique')
              changelog = changelog.replace(release_marker, note + release_marker, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY
          git diff --check
          npm ci
          npm audit --workspaces --audit-level=high

      - name: Build native parity kernel and verify complete repository contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          VENV_PY="$PWD/services/analysis-engine/.venv/bin/python"
          uvx maturin@1.9.6 build --release \
            --manifest-path services/analysis-engine/rust/Cargo.toml \
            --interpreter "$VENV_PY" \
            --out services/analysis-engine/rust/dist
          uv pip install --python "$VENV_PY" services/analysis-engine/rust/dist/*.whl
          services/analysis-engine/.venv/bin/python -m pytest -q \
            services/analysis-engine/tests/test_chord_recognizer_opt.py \
            services/analysis-engine/tests/test_numeric_parity.py
          ./scripts/harness/quickcheck.sh
          git diff --check

      - name: Publish verified focused cleanup
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: jules-15985039724708397070-07b0954f
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head="$(git ls-remote "$remote_url" "refs/heads/$BRANCH_NAME" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm .github/workflows/finalize-pr732-bounded-chord-optimization.yml
          rm -rf services/analysis-engine/rust/dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            package-lock.json \
            services/analysis-engine/src/bandscope_analysis/chords/chord_recognizer.py \
            services/analysis-engine/tests/test_chord_recognizer_opt.py | sort)"
          test "$actual" = "$expected"
          git commit -m 'fix(chords): preserve long-form input and independent parity evidence'
          git push \
            --force-with-lease="refs/heads/${BRANCH_NAME}:${EXPECTED_HEAD}" \
            "$remote_url" "HEAD:refs/heads/$BRANCH_NAME"
