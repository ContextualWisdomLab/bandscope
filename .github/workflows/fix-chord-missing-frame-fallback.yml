name: Fix chord missing-frame fallback

on:
  push:
    branches: [jules-15985039724708397070-07b0954f]
    paths:
      - scripts/ci/fix_chord_missing_frame_fallback.py
      - .github/workflows/fix-chord-missing-frame-fallback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'ContextualWisdomLab/bandscope' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: jules-15985039724708397070-07b0954f
          fetch-depth: 0

      - name: Apply reviewed fallback fix
        run: python3 scripts/ci/fix_chord_missing_frame_fallback.py

      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          python3 -m compileall -q services/analysis-engine/src/bandscope_analysis/chords/chord_recognizer.py services/analysis-engine/tests/test_chord_recognizer_opt.py
          test ! -e scripts/ci/fix_chord_missing_frame_fallback.py
          test ! -e .github/workflows/fix-chord-missing-frame-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(chords): keep missing-frame fallback neutral"
          git push origin HEAD:refs/heads/jules-15985039724708397070-07b0954f
