name: Repair PR1119 policy contract

on:
  push:
    branches:
      - fix/trivy-pr-code-scanning
    paths:
      - .github/repair-pr1119-policy-contract.trigger

permissions:
  contents: write

concurrency:
  group: repair-pr1119-policy-contract
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ github.repository == 'ContextualWisdomLab/bandscope' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/trivy-pr-code-scanning
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Revalidate exact writer branch head
        run: |
          set -euo pipefail
          expected_ref="refs/heads/fix/trivy-pr-code-scanning"
          test "$GITHUB_REF" = "$expected_ref"
          start_head=$(git rev-parse HEAD)
          test "$start_head" = "$GITHUB_SHA"
          remote_head=$(git ls-remote --exit-code origin "$expected_ref" | awk '{print $1}')
          test "$remote_head" = "$start_head"
          echo "START_HEAD=$start_head" >> "$GITHUB_ENV"
      - name: Repair stale policy and verify
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("services/analysis-engine/tests/test_supply_chain_policy.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "def test_central_governance_workflows_are_push_only_where_local_signals_remain() -> None:\n"
          end_marker = "\ndef test_opencode_review_declares_top_level_token_permissions() -> None:\n"
          if start_marker not in text or end_marker not in text:
              raise SystemExit("expected stale policy function boundary not found on exact writer head")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          stale = text[start:end]
          if 'for local_signal in ("codeql.yml", "ossf-scorecard.yml", "trivy.yml"):' not in stale:
              raise SystemExit("stale local-signal grouping is no longer present")
          if 'assert "pull_request:" not in workflow.read_text(encoding="utf-8")' not in stale:
              raise SystemExit("stale push-only assertion is no longer present")
          encoded = ""
          replacement = base64.b64decode(encoded).decode("utf-8")
          path.write_text(text[:start] + replacement + text[end + 1 :], encoding="utf-8")
          PY
          uv sync --project services/analysis-engine --group dev --locked
          PYTHONPATH=. uv run --project services/analysis-engine pytest -q \
            services/analysis-engine/tests/test_supply_chain_policy.py::test_central_governance_workflows_preserve_local_security_signal_boundaries \
            scripts/checks/test_verify_trivy_pr_scan.py
          git diff --check
      - name: Commit repair and retire one-shot lane
        run: |
          set -euo pipefail
          expected_ref="refs/heads/fix/trivy-pr-code-scanning"
          remote_head=$(git ls-remote --exit-code origin "$expected_ref" | awk '{print $1}')
          test "$remote_head" = "$START_HEAD"
          rm -f .github/workflows/repair-pr1119-policy-contract.yml
          rm -f .github/repair-pr1119-policy-contract.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/analysis-engine/tests/test_supply_chain_policy.py \
            .github/workflows/repair-pr1119-policy-contract.yml \
            .github/repair-pr1119-policy-contract.trigger
          git commit -m "test: align Trivy PR policy contract"
          git push origin HEAD:fix/trivy-pr-code-scanning
