name: Repair PR 1119 supply-chain policy

on:
  push:
    branches:
      - fix/trivy-pr-code-scanning

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/trivy-pr-code-scanning
          fetch-depth: 0
      - name: Repair stale local-signal trigger contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("services/analysis-engine/tests/test_supply_chain_policy.py")
          content = path.read_text(encoding="utf-8")
          old = '''def test_central_governance_workflows_are_push_only_where_local_signals_remain() -> None:
              """Ensure central PR governance keeps only repo-local push security signals."""
              repo_root = Path(__file__).resolve().parents[3]
              workflows_dir = repo_root / ".github" / "workflows"

              assert not (workflows_dir / "dependency-review.yml").exists()

              for local_signal in ("codeql.yml", "ossf-scorecard.yml", "trivy.yml"):
                  workflow = workflows_dir / local_signal
                  assert workflow.exists(), (
                      f"{local_signal} keeps repository-local security-tab/SAST signal "
                      "while central required workflows handle PR enforcement"
                  )
                  assert "pull_request:" not in workflow.read_text(encoding="utf-8")

              supply_chain = load_module(
                  "scripts/checks/verify_supply_chain.py", "verify_supply_chain_central"
              )
              required = {path.as_posix() for path in supply_chain.REQUIRED_FILES}
              assert ".github/workflows/dependency-review.yml" not in required
              assert ".github/workflows/codeql.yml" in required
              assert ".github/workflows/ossf-scorecard.yml" in required
          '''
          new = '''def test_central_governance_workflows_keep_local_signal_trigger_boundaries() -> None:
              """Ensure delegated PR governance preserves each repo-local security signal."""
              repo_root = Path(__file__).resolve().parents[3]
              workflows_dir = repo_root / ".github" / "workflows"

              assert not (workflows_dir / "dependency-review.yml").exists()

              for local_signal in ("codeql.yml", "ossf-scorecard.yml"):
                  workflow = workflows_dir / local_signal
                  assert workflow.exists(), (
                      f"{local_signal} keeps repository-local security-tab/SAST signal "
                      "while central required workflows handle PR enforcement"
                  )
                  assert "pull_request:" not in workflow.read_text(encoding="utf-8")

              trivy_workflow = workflows_dir / "trivy.yml"
              assert trivy_workflow.exists(), (
                  "trivy.yml keeps the repository-local PR-head code-scanning signal "
                  "while the central Security Scan remains the required PR enforcement gate"
              )
              assert "pull_request:" in trivy_workflow.read_text(encoding="utf-8")

              supply_chain = load_module(
                  "scripts/checks/verify_supply_chain.py", "verify_supply_chain_central"
              )
              required = {path.as_posix() for path in supply_chain.REQUIRED_FILES}
              assert ".github/workflows/dependency-review.yml" not in required
              assert ".github/workflows/codeql.yml" in required
              assert ".github/workflows/ossf-scorecard.yml" in required
          '''
          if content.count(old) != 1:
              raise SystemExit("expected exact stale policy block once; refusing ambiguous repair")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/repair-pr1119-supply-chain-policy.yml
          git diff --check
          git diff -- services/analysis-engine/tests/test_supply_chain_policy.py .github/workflows/repair-pr1119-supply-chain-policy.yml
      - name: Commit repaired policy and retire one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/analysis-engine/tests/test_supply_chain_policy.py .github/workflows/repair-pr1119-supply-chain-policy.yml
          git commit -m "test(ci): align local Trivy PR-head policy"
          git push origin HEAD:fix/trivy-pr-code-scanning
