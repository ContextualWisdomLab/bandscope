name: Bootstrap naruon boundary hardening

on:
  push:
    branches:
      - feat/naruon-rehearsal-handoff-v1
    paths:
      - .github/workflows/bootstrap-naruon-boundary-hardening.yml
      - scripts/ci/bootstrap_naruon_boundary_hardening.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/naruon-rehearsal-handoff-v1
          fetch-depth: 0

      - name: Apply reviewed hardening
        run: python3 scripts/ci/bootstrap_naruon_boundary_hardening.py

      - name: Commit direct source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-types/src/naruon.ts packages/shared-types/test/naruon-hardening.test.ts scripts/ci/bootstrap_naruon_boundary_hardening.py .github/workflows/bootstrap-naruon-boundary-hardening.yml
          git commit -m "fix(shared-types): apply naruon boundary hardening"
          git push origin HEAD:feat/naruon-rehearsal-handoff-v1
