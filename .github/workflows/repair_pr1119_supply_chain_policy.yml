name: Repair PR1119 supply-chain policy

on:
  push:
    branches:
      - fix/trivy-pr-code-scanning

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair_policy_test:
    name: repair-policy-test
    if: github.repository == 'ContextualWisdomLab/bandscope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/trivy-pr-code-scanning
      - name: Repair stale Trivy trigger policy and retire source-fix workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy_test_path = Path("services/analysis-engine/tests/test_supply_chain_policy.py")
          policy_test_text = policy_test_path.read_text(encoding="utf-8")
          start_marker = "def test_central_governance_workflows_are_push_only_where_local_signals_remain() -> None:\n"
          end_marker = "\n\ndef test_opencode_review_declares_top_level_token_permissions() -> None:\n"
          if policy_test_text.count(start_marker) != 1 or policy_test_text.count(end_marker) != 1:
              raise SystemExit("expected exactly one stale Trivy policy contract boundary")
          contract_start = policy_test_text.index(start_marker)
          contract_end = policy_test_text.index(end_marker, contract_start)
          corrected_contract = '''def test_central_governance_workflows_use_expected_local_signal_triggers() -> None:
              """Ensure each repository-local security signal uses its required trigger scope."""
              repo_root = Path(__file__).resolve().parents[3]
              workflows_dir = repo_root / ".github" / "workflows"

              assert not (workflows_dir / "dependency-review.yml").exists()

              for push_only_signal in ("codeql.yml", "ossf-scorecard.yml"):
                  workflow_path = workflows_dir / push_only_signal
                  assert workflow_path.exists(), (
                      f"{push_only_signal} keeps repository-local security-tab/SAST signal "
                      "while central required workflows handle PR enforcement"
                  )
                  workflow_text = workflow_path.read_text(encoding="utf-8")
                  assert "pull_request:" not in workflow_text

              trivy_workflow_path = workflows_dir / "trivy.yml"
              assert trivy_workflow_path.exists(), (
                  "trivy.yml keeps repository-local PR-head SARIF evidence while the central "
                  "Security Scan remains the required enforcement authority"
              )
              trivy_workflow_text = trivy_workflow_path.read_text(encoding="utf-8")
              assert "pull_request:" in trivy_workflow_text
              assert "pull_request_target:" not in trivy_workflow_text

              supply_chain = load_module(
                  "scripts/checks/verify_supply_chain.py", "verify_supply_chain_central"
              )
              required = {path.as_posix() for path in supply_chain.REQUIRED_FILES}
              assert ".github/workflows/dependency-review.yml" not in required
              assert ".github/workflows/codeql.yml" in required
              assert ".github/workflows/ossf-scorecard.yml" in required
          '''
          corrected_contract = "\n".join(
              source_line[14:] if source_line.startswith("              ") else source_line
              for source_line in corrected_contract.splitlines()
          )
          policy_test_text = (
              policy_test_text[:contract_start]
              + corrected_contract
              + policy_test_text[contract_end:]
          )
          policy_test_path.write_text(policy_test_text, encoding="utf-8")
          PY
          python3 -m py_compile services/analysis-engine/tests/test_supply_chain_policy.py
          git diff --check
          git config user.name "cwl-source-repair[bot]"
          git config user.email "cwl-source-repair[bot]@users.noreply.github.com"
          git add services/analysis-engine/tests/test_supply_chain_policy.py
          git rm .github/workflows/repair_pr1119_supply_chain_policy.yml
          git commit -m "test(ci): align Trivy PR-head policy contract"
          git push origin HEAD:fix/trivy-pr-code-scanning