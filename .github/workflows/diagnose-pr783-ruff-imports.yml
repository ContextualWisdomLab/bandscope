name: Diagnose PR 783 Ruff import ordering

on:
  push:
    branches:
      - fix/high-security-dependency-baseline
    paths:
      - .github/workflows/diagnose-pr783-ruff-imports.yml

permissions:
  contents: read

concurrency:
  group: diagnose-pr783-ruff-imports
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  diagnose:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.ref == 'refs/heads/fix/high-security-dependency-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false

      - name: Print Ruff's exact import repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv sync --project services/analysis-engine --group dev --frozen
          cd services/analysis-engine
          uv run ruff check \
            tests/test_high_security_dependency_baseline.py \
            tests/test_npm_toolchain_contract.py \
            --fix-only
          git diff -- \
            tests/test_high_security_dependency_baseline.py \
            tests/test_npm_toolchain_contract.py
          test -n "$(git diff --name-only -- tests/test_high_security_dependency_baseline.py tests/test_npm_toolchain_contract.py)"
