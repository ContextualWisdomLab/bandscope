name: release

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.8.6"
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Install node dependencies
        run: npm ci
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Run harness verification
        run: ./scripts/harness/quickcheck.sh
      - name: Build frontend
        run: npm run build --workspace @bandscope/desktop
      - name: Build desktop shell
        run: cargo +stable build --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked
      - name: Package release artifact
        run: python3 scripts/release/package_desktop_artifact.py
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          path: .
          format: cyclonedx-json
          output-file: bandscope-release-sbom.cdx.json
      - name: Upload release artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandscope-release-bundle
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.manifest.txt
            bandscope-release-sbom.cdx.json
            supply-chain/supplemental-component-inventory.json
