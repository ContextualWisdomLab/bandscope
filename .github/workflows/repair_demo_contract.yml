name: Repair licensed demo contract

on:
  push:
    branches:
      - feat/licensed-demo-first-run

permissions:
  contents: write

jobs:
  repair_demo_contract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/licensed-demo-first-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair generated audio, metadata, engine title propagation, and regressions
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import sys
          import wave
          from pathlib import Path

          def sha256_file(file_path: Path) -> str:
              return hashlib.sha256(file_path.read_bytes()).hexdigest()

          generator_path = Path("scripts/generate_licensed_demo_wav.py")
          generator_source = generator_path.read_text(encoding="utf-8")
          assert "DURATION_SECONDS = 2" in generator_source
          assert "frequency = 220.0 if moment < 1.0 else 330.0" in generator_source
          generator_source = generator_source.replace(
              "DURATION_SECONDS = 2",
              "DURATION_SECONDS = 10",
              1,
          ).replace(
              "frequency = 220.0 if moment < 1.0 else 330.0",
              "frequency = 220.0 if moment < DURATION_SECONDS / 2 else 330.0",
              1,
          )
          generator_path.write_text(generator_source, encoding="utf-8")
          subprocess.run([sys.executable, str(generator_path)], check=True)

          demo_resource_root = Path("apps/desktop/src-tauri/resources/demo")
          audio_path = demo_resource_root / "late-night-set.wav"
          annotation_path = demo_resource_root / "annotations.json"
          provenance_path = demo_resource_root / "provenance.json"
          license_path = demo_resource_root / "LICENSE"

          annotation_document = json.loads(annotation_path.read_text(encoding="utf-8"))
          annotation_sections = annotation_document["sections"]
          assert len(annotation_sections) == 2
          annotation_sections[0]["timeRange"] = {"start": 0, "end": 5}
          annotation_sections[1]["timeRange"] = {"start": 5, "end": 10}
          annotation_path.write_text(
              json.dumps(annotation_document, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          provenance_document = json.loads(provenance_path.read_text(encoding="utf-8"))
          provenance_assets = {asset["path"]: asset for asset in provenance_document["assets"]}
          provenance_assets["late-night-set.wav"]["sha256"] = sha256_file(audio_path)
          provenance_assets["late-night-set.wav"]["bytes"] = audio_path.stat().st_size
          provenance_assets["annotations.json"]["sha256"] = sha256_file(annotation_path)
          provenance_assets["annotations.json"]["bytes"] = annotation_path.stat().st_size
          provenance_path.write_text(
              json.dumps(provenance_document, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          asset_hashes = {
              "late-night-set.wav": sha256_file(audio_path),
              "LICENSE": sha256_file(license_path),
              "annotations.json": sha256_file(annotation_path),
              "provenance.json": sha256_file(provenance_path),
          }

          inventory_path = Path("supply-chain/supplemental-component-inventory.json")
          inventory_document = json.loads(inventory_path.read_text(encoding="utf-8"))
          for asset_record in inventory_document["bundledAssets"]:
              asset_name = asset_record["assetName"]
              if asset_name in asset_hashes:
                  asset_record["assetChecksum"] = f"sha256:{asset_hashes[asset_name]}"
          inventory_path.write_text(
              json.dumps(inventory_document, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          inventory_test_path = Path(
              "services/analysis-engine/tests/test_demo_supply_chain_inventory.py"
          )
          inventory_test_source = inventory_test_path.read_text(encoding="utf-8")
          previous_hashes = {
              "late-night-set.wav": "cfe5716c4e7489db7f14104513ffc70af199137c2320bd66d7b6bec4f41dacc0",
              "LICENSE": "1657b89949ca8bfb2920e26dceb4c1012d6212b5d77eda7d7f3921da29adde5e",
              "annotations.json": "28236d31e72c58bf11aad3945e3407d8e30e71b223326f9ffb82a83091d73044",
              "provenance.json": "1c3ec8f3f7e4a579f45a36f58183ed480ed2757499628dfc5f3dc8deebbdfe38",
          }
          for asset_name, previous_hash in previous_hashes.items():
              expected_hash = asset_hashes[asset_name]
              if previous_hash != expected_hash:
                  assert previous_hash in inventory_test_source
                  inventory_test_source = inventory_test_source.replace(
                      previous_hash,
                      expected_hash,
                      1,
                  )
          inventory_test_path.write_text(inventory_test_source, encoding="utf-8")

          core_path = Path("apps/desktop/core/src/lib.rs")
          core_source = core_path.read_text(encoding="utf-8")
          previous_audio_size = "pub const DEMO_AUDIO_BYTES: u64 = 88244;"
          assert previous_audio_size in core_source
          core_source = core_source.replace(
              previous_audio_size,
              f"pub const DEMO_AUDIO_BYTES: u64 = {audio_path.stat().st_size};",
              1,
          )
          core_path.write_text(core_source, encoding="utf-8")

          bridge_test_path = Path("apps/desktop/src/lib/analysis.test.ts")
          bridge_test_source = bridge_test_path.read_text(encoding="utf-8")
          assert "fileSizeBytes: 88244" in bridge_test_source
          bridge_test_source = bridge_test_source.replace(
              "fileSizeBytes: 88244",
              f"fileSizeBytes: {audio_path.stat().st_size}",
              1,
          )
          bridge_test_path.write_text(bridge_test_source, encoding="utf-8")

          engine_path = Path("services/analysis-engine/src/bandscope_analysis/api.py")
          engine_source = engine_path.read_text(encoding="utf-8")
          function_start = engine_source.index("def _build_local_audio_features(")
          function_end = engine_source.index("\n\ndef run_analysis_job_updates(", function_start)
          feature_builder = engine_source[function_start:function_end]
          assert '    separation_result = _run_stem_separation_with_timeout(' in feature_builder
          feature_builder = feature_builder.replace(
              '    separation_result = _run_stem_separation_with_timeout(',
              '    source_title = request["sourceLabel"]\n'
              '    separation_result = _run_stem_separation_with_timeout(',
              1,
          )
          assert '                return {**separation_result, "stem_role_types": stem_role_types}' in feature_builder
          feature_builder = feature_builder.replace(
              '                return {**separation_result, "stem_role_types": stem_role_types}',
              '                return {\n'
              '                    **separation_result,\n'
              '                    "stem_role_types": stem_role_types,\n'
              '                    "title": source_title,\n'
              '                }',
              1,
          )
          assert '        return separation_result' in feature_builder
          feature_builder = feature_builder.replace(
              '        return separation_result',
              '        return {**separation_result, "title": source_title}',
              1,
          )
          assert '        "sr": separation_result["sample_rate"],\n' in feature_builder
          feature_builder = feature_builder.replace(
              '        "sr": separation_result["sample_rate"],\n',
              '        "sr": separation_result["sample_rate"],\n'
              '        "title": source_title,\n',
              1,
          )
          engine_source = (
              engine_source[:function_start]
              + feature_builder
              + engine_source[function_end:]
          )
          engine_path.write_text(engine_source, encoding="utf-8")

          duration_test_path = Path(
              "services/analysis-engine/tests/test_licensed_demo_duration_contract.py"
          )
          duration_test_path.write_text(
              '''"""Regressions for the licensed demo structural-analysis contract."""

          from __future__ import annotations

          import json
          import wave
          from pathlib import Path

          import numpy as np

          from bandscope_analysis.sections.segmenter import MIN_SEGMENT_DURATION_SECONDS, segment_audio

          REPO_ROOT = Path(__file__).resolve().parents[3]
          DEMO_RESOURCE_ROOT = REPO_ROOT / "apps" / "desktop" / "src-tauri" / "resources" / "demo"
          DEMO_AUDIO_PATH = DEMO_RESOURCE_ROOT / "late-night-set.wav"
          DEMO_ANNOTATION_PATH = DEMO_RESOURCE_ROOT / "annotations.json"


          def _read_demo_audio() -> tuple[np.ndarray, int, float]:
              """Decode the mono PCM demo through the stdlib WAV reader."""
              with wave.open(str(DEMO_AUDIO_PATH), "rb") as wav_file:
                  sample_rate = wav_file.getframerate()
                  frame_count = wav_file.getnframes()
                  assert wav_file.getnchannels() == 1
                  assert wav_file.getsampwidth() == 2
                  audio_samples = np.frombuffer(wav_file.readframes(frame_count), dtype="<i2").astype(
                      np.float32
                  ) / 32768.0
              return audio_samples, sample_rate, frame_count / sample_rate


          def test_licensed_demo_spans_two_structural_windows() -> None:
              """Keep the bundled demo long enough to avoid the short-audio fallback."""
              _audio_samples, _sample_rate, duration_seconds = _read_demo_audio()
              assert duration_seconds >= MIN_SEGMENT_DURATION_SECONDS * 2

              annotation_document = json.loads(DEMO_ANNOTATION_PATH.read_text(encoding="utf-8"))
              section_ranges = [section["timeRange"] for section in annotation_document["sections"]]
              assert section_ranges == [{"start": 0, "end": 5}, {"start": 5, "end": 10}]
              assert all(
                  section_range["end"] - section_range["start"] >= MIN_SEGMENT_DURATION_SECONDS
                  for section_range in section_ranges
              )


          def test_licensed_demo_reaches_structural_segmentation() -> None:
              """Prove the source fixture itself yields multiple structural candidates."""
              audio_samples, sample_rate, duration_seconds = _read_demo_audio()
              detected_sections = segment_audio(audio_samples, sample_rate, duration_seconds)
              assert len(detected_sections) >= 2
              assert all(
                  "Audio too short for structural analysis" not in section["confidence_notes"]
                  for section in detected_sections
              )
          '''.replace("          ", "", 1),
              encoding="utf-8",
          )

          with wave.open(str(audio_path), "rb") as wav_file:
              assert wav_file.getnchannels() == 1
              assert wav_file.getsampwidth() == 2
              assert wav_file.getframerate() == 22050
              assert wav_file.getnframes() / wav_file.getframerate() == 10
          assert audio_path.stat().st_size == 441044

          refreshed_provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          refreshed_assets = {asset["path"]: asset for asset in refreshed_provenance["assets"]}
          for asset_name in ("late-night-set.wav", "LICENSE", "annotations.json"):
              asset_path = demo_resource_root / asset_name
              assert refreshed_assets[asset_name]["sha256"] == sha256_file(asset_path)
              assert refreshed_assets[asset_name]["bytes"] == asset_path.stat().st_size

          refreshed_inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          inventory_hashes = {
              record["assetName"]: record["assetChecksum"]
              for record in refreshed_inventory["bundledAssets"]
          }
          for asset_name, asset_hash in asset_hashes.items():
              assert inventory_hashes[asset_name] == f"sha256:{asset_hash}"
          PY

      - name: Validate focused demo contracts
        shell: bash
        run: |
          python -m py_compile scripts/generate_licensed_demo_wav.py \
            services/analysis-engine/tests/test_demo_supply_chain_inventory.py \
            services/analysis-engine/tests/test_licensed_demo_duration_contract.py \
            services/analysis-engine/src/bandscope_analysis/api.py
          python - <<'PY'
          import json
          import wave
          from pathlib import Path

          demo_resource_root = Path("apps/desktop/src-tauri/resources/demo")
          with wave.open(str(demo_resource_root / "late-night-set.wav"), "rb") as wav_file:
              assert wav_file.getnframes() / wav_file.getframerate() == 10
          annotation_document = json.loads(
              (demo_resource_root / "annotations.json").read_text(encoding="utf-8")
          )
          assert [section["timeRange"] for section in annotation_document["sections"]] == [
              {"start": 0, "end": 5},
              {"start": 5, "end": 10},
          ]
          PY

      - name: Commit canonical repair and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair_demo_contract.yml
          git add \
            scripts/generate_licensed_demo_wav.py \
            apps/desktop/src-tauri/resources/demo/late-night-set.wav \
            apps/desktop/src-tauri/resources/demo/annotations.json \
            apps/desktop/src-tauri/resources/demo/provenance.json \
            supply-chain/supplemental-component-inventory.json \
            services/analysis-engine/tests/test_demo_supply_chain_inventory.py \
            services/analysis-engine/tests/test_licensed_demo_duration_contract.py \
            services/analysis-engine/src/bandscope_analysis/api.py \
            apps/desktop/core/src/lib.rs \
            apps/desktop/src/lib/analysis.test.ts
          git commit -m "fix(demo): make licensed audio structurally analyzable"
          git push origin HEAD:feat/licensed-demo-first-run
