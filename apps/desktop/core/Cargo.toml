[package]
name = "bandscope-desktop-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/root.rs"

[features]
custom-protocol = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.53", features = ["formatting"] }
url = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
# These lints are command-/behavior-level refactors. The current desktop core
# is being held byte-for-byte on behavior while coverage closure lands.
too_many_arguments = "allow"
type_complexity = "allow"
