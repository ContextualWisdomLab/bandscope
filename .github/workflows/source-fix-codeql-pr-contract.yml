name: CodeQL PR contract source repair

on:
  push:
    branches:
      - fix/codeql-action-consistency-v4-37-6

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

concurrency:
  group: source-fix-codeql-pr-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair_codeql_pr_contract:
    name: repair CodeQL PR contract and self-delete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Verify exact branch authority
        env:
          STARTING_HEAD_SHA: ${{ github.sha }}
          TARGET_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_head_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH_NAME}" | cut -f1)"
          test "${remote_head_sha}" = "${STARTING_HEAD_SHA}"
      - name: Repair stale event policy and traceability
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          test_path = Path("services/analysis-engine/tests/test_supply_chain_policy.py")
          test_source = test_path.read_text(encoding="utf-8")
          stale_test_pattern = re.compile(
              r"def test_central_governance_workflows_are_push_only_where_local_signals_remain\(\) -> None:\n"
              r".*?"
              r"(?=\n\ndef test_opencode_review_declares_top_level_token_permissions)",
              re.DOTALL,
          )
          stale_matches = stale_test_pattern.findall(test_source)
          if len(stale_matches) != 1:
              raise SystemExit(
                  f"expected one stale central-governance test, found {len(stale_matches)}"
              )
          replacement_test = '''def test_local_security_workflows_match_pull_request_coverage_contract() -> None:
              """Ensure each repository security signal follows its owned event contract."""
              repository_root = Path(__file__).resolve().parents[3]
              workflows_directory = repository_root / ".github" / "workflows"

              assert not (workflows_directory / "dependency-review.yml").exists()

              pull_request_signal_names = ("codeql.yml", "ossf-scorecard.yml")
              for workflow_filename in pull_request_signal_names:
                  workflow_path = workflows_directory / workflow_filename
                  assert workflow_path.exists(), (
                      f"{workflow_filename} must retain repository-local security evidence"
                  )
                  workflow_text = workflow_path.read_text(encoding="utf-8")
                  assert "push:" in workflow_text, (
                      f"{workflow_filename} must retain protected-branch push reporting"
                  )
                  assert "pull_request:" in workflow_text, (
                      f"{workflow_filename} must collect pull-request-head evidence"
                  )
                  assert "pull_request_target:" not in workflow_text
                  pull_request_section = workflow_text.split("  pull_request:\\n", 1)[1].split(
                      "\\npermissions:", 1
                  )[0]
                  assert "      - develop\\n" in pull_request_section
                  assert "      - main\\n" in pull_request_section

              trivy_workflow_path = workflows_directory / "trivy.yml"
              assert trivy_workflow_path.exists()
              trivy_workflow_text = trivy_workflow_path.read_text(encoding="utf-8")
              assert "push:" in trivy_workflow_text
              assert "pull_request:" not in trivy_workflow_text

              supply_chain_module = load_module(
                  "scripts/checks/verify_supply_chain.py", "verify_supply_chain_central"
              )
              required_workflow_paths = {
                  required_path.as_posix() for required_path in supply_chain_module.REQUIRED_FILES
              }
              assert ".github/workflows/dependency-review.yml" not in required_workflow_paths
              assert ".github/workflows/codeql.yml" in required_workflow_paths
              assert ".github/workflows/ossf-scorecard.yml" in required_workflow_paths
          '''
          test_path.write_text(
              stale_test_pattern.sub(replacement_test.rstrip(), test_source), encoding="utf-8"
          )

          policy_path = Path("scripts/checks/verify_supply_chain.py")
          policy_source = policy_path.read_text(encoding="utf-8")
          stale_policy_comment = '''    # Dependency review runs via the org-level required workflow in
              # ContextualWisdomLab/.github; repo-local CodeQL and Scorecard stay push-only
              # so GitHub/Scorecard can still observe SAST and supply-chain security tabs.
          '''
          repaired_policy_comment = '''    # Dependency review runs via the org-level required workflow in
              # ContextualWisdomLab/.github. Repository-local CodeQL and Scorecard retain push
              # reporting and also collect PR-head evidence while the live organization ruleset
              # does not attach the corresponding central required workflows.
          '''
          if policy_source.count(stale_policy_comment) != 1:
              raise SystemExit("stale supply-chain policy comment changed concurrently")
          policy_path.write_text(
              policy_source.replace(stale_policy_comment, repaired_policy_comment), encoding="utf-8"
          )

          doctoring_path = Path("docs/doctoring/codeql-action-atomic-revision.md")
          doctoring_source = doctoring_path.read_text(encoding="utf-8")
          doctoring_marker = "## Pull-request CodeQL evidence"
          if doctoring_marker not in doctoring_source:
              doctoring_source += '''

          ## Pull-request CodeQL evidence

          BandScope requires CodeQL analysis to materialize on ordinary `pull_request` heads targeting `develop` and `main` as well as on protected-branch pushes. On 2026-09-02, live organization ruleset `18156473` did not attach `ContextualWisdomLab/.github`'s central `codeql-pr.yml` required workflow, so the repository-local `codeql.yml` carries the temporary PR-head safety net. `pull_request_target` is explicitly forbidden for this lane.

          The local trigger is a compatibility boundary, not a second source of organization policy. Remove it only after the live organization ruleset is independently verified to require the central CodeQL PR workflow for BandScope. The unique CodeQL PR-head behavior from #1144 is carried here by the canonical atomic CodeQL lifecycle owner, together with the newer v4.37.9 lifecycle pin and executable regression coverage; predecessor checks or approvals do not transfer.
          '''
              doctoring_path.write_text(doctoring_source, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog_source = changelog_path.read_text(encoding="utf-8")
          changelog_entry = (
              "- Restored CodeQL analysis for pull-request heads targeting `develop` and `main` "
              "while the live organization ruleset lacks the central CodeQL required workflow; "
              "the repository-local trigger is removed only after central enforcement is verified.\n"
          )
          if changelog_entry not in changelog_source:
              fixed_marker = "### Fixed\n\n"
              if changelog_source.count(fixed_marker) < 1:
                  raise SystemExit("CHANGELOG Unreleased Fixed section not found")
              changelog_source = changelog_source.replace(
                  fixed_marker, fixed_marker + changelog_entry, 1
              )
              changelog_path.write_text(changelog_source, encoding="utf-8")
          PY
      - name: Verify focused CodeQL contracts
        run: |
          set -euo pipefail
          uv sync --project services/analysis-engine --group dev --locked
          uv run --project services/analysis-engine pytest -q \
            services/analysis-engine/tests/test_codeql_pr_code_scanning_contract.py \
            services/analysis-engine/tests/test_supply_chain_policy.py \
            services/analysis-engine/tests/test_codeql_action_revision_contract.py \
            services/analysis-engine/tests/test_scorecard_pr_code_scanning_contract.py
          git diff --check
      - name: Commit repair and remove source-fix workflow
        env:
          STARTING_HEAD_SHA: ${{ github.sha }}
          TARGET_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm .github/workflows/source-fix-codeql-pr-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(codeql): reconcile PR-head security contract"
          remote_head_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH_NAME}" | cut -f1)"
          test "${remote_head_sha}" = "${STARTING_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH_NAME}"
