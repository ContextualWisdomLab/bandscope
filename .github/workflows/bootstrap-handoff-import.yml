name: Bootstrap handoff import integration

on:
  push:
    branches: [feat/handoff-import-roundtrip]
    paths:
      - scripts/ci/bootstrap_handoff_import.py
      - .github/workflows/bootstrap-handoff-import.yml
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/ci/bootstrap_handoff_import.py
      - .github/workflows/bootstrap-handoff-import.yml
  workflow_dispatch:

concurrency:
  group: bootstrap-handoff-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope'
      && github.actor != 'github-actions[bot]'
      && (
        (github.event_name == 'push' && github.ref_name == 'feat/handoff-import-roundtrip')
        || (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.head.ref == 'feat/handoff-import-roundtrip'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/handoff-import-roundtrip
          fetch-depth: 0
          persist-credentials: true

      - name: Use repository Node.js contract
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install lifecycle-disabled dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply reviewed App and locale patch
        run: python3 scripts/ci/bootstrap_handoff_import.py

      - name: Verify generated integration and desktop quality gates
        run: |
          set -euo pipefail
          git diff --check
          python3 -m json.tool apps/desktop/src/locales/en/common.json >/dev/null
          python3 -m json.tool apps/desktop/src/locales/ko/common.json >/dev/null
          grep -F 'createAnalysisRequestForSelection(' apps/desktop/src/App.tsx >/dev/null
          grep -F '<HandoffImportControl' apps/desktop/src/App.tsx >/dev/null
          test ! -e scripts/ci/bootstrap_handoff_import.py
          test ! -e .github/workflows/bootstrap-handoff-import.yml
          npm run lint --workspace @bandscope/desktop
          npm run typecheck --workspace @bandscope/desktop
          npm test --workspace @bandscope/desktop
          npm run build --workspace @bandscope/desktop

      - name: Commit verified integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No verified integration changes to commit."
            exit 0
          fi
          git commit -m "feat(handoff): wire validated import into App"
          git push origin HEAD:refs/heads/feat/handoff-import-roundtrip
