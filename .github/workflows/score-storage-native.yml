name: score-storage-native

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "apps/desktop/core/Cargo.toml"
      - "apps/desktop/core/src/root.rs"
      - "apps/desktop/core/src/lib.rs"
      - "apps/desktop/core/src/content_sha256.rs"
      - "apps/desktop/core/src/score_pdf.rs"
      - "apps/desktop/core/src/score_publication.rs"
      - "apps/desktop/core/src/score_recovery.rs"
      - "apps/desktop/core/src/score_retention.rs"
      - "apps/desktop/core/src/score_storage.rs"
      - "apps/desktop/core/tests/content_sha256_shared_kernel.rs"
      - "apps/desktop/core/tests/score_pdf_*.rs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/src/main.rs"
      - "docs/traceability/score-attachment-publication.md"
      - "docs/traceability/score-attachment-recovery-inventory.md"
      - "docs/traceability/score-attachment-recovery-object-receipt.md"
      - "docs/traceability/score-attachment-post-link-recovery.md"
      - "docs/traceability/score-attachment-success-durability.md"
      - "docs/traceability/score-attachment-unix-stage-cleanup.md"
      - "docs/traceability/score-attachment-fault-recovery.md"
      - "docs/traceability/score-attachment-windows-acl-recovery.md"
      - ".github/workflows/score-storage-native.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "apps/desktop/core/Cargo.toml"
      - "apps/desktop/core/src/root.rs"
      - "apps/desktop/core/src/lib.rs"
      - "apps/desktop/core/src/content_sha256.rs"
      - "apps/desktop/core/src/score_pdf.rs"
      - "apps/desktop/core/src/score_publication.rs"
      - "apps/desktop/core/src/score_recovery.rs"
      - "apps/desktop/core/src/score_retention.rs"
      - "apps/desktop/core/src/score_storage.rs"
      - "apps/desktop/core/tests/content_sha256_shared_kernel.rs"
      - "apps/desktop/core/tests/score_pdf_*.rs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/src/main.rs"
      - "docs/traceability/score-attachment-publication.md"
      - "docs/traceability/score-attachment-recovery-inventory.md"
      - "docs/traceability/score-attachment-recovery-object-receipt.md"
      - "docs/traceability/score-attachment-post-link-recovery.md"
      - "docs/traceability/score-attachment-success-durability.md"
      - "docs/traceability/score-attachment-unix-stage-cleanup.md"
      - "docs/traceability/score-attachment-fault-recovery.md"
      - "docs/traceability/score-attachment-windows-acl-recovery.md"
      - ".github/workflows/score-storage-native.yml"

permissions:
  contents: read

jobs:
  native-score-storage:
    name: test / score-storage / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run owned Score Storage unit tests
        shell: bash
        run: |
          cargo +1.97.1 test \
            --manifest-path apps/desktop/core/Cargo.toml \
            --lib score_storage::tests::
          cargo +1.97.1 test \
            --manifest-path apps/desktop/core/Cargo.toml \
            --lib score_recovery::tests::
          cargo +1.97.1 test \
            --manifest-path apps/desktop/core/Cargo.toml \
            --lib score_publication::tests::
          cargo +1.97.1 test \
            --manifest-path apps/desktop/core/Cargo.toml \
            --test content_sha256_shared_kernel
      - name: Verify shipped desktop excludes Score Storage fault injection
        shell: bash
        run: |
          feature_tree="$(cargo +1.97.1 tree \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            -e features \
            -i bandscope-desktop-core)"
          if printf '%s\n' "$feature_tree" | grep -F 'score-storage-fault-injection'; then
            echo "::error::The shipped desktop dependency graph enables score-storage-fault-injection."
            exit 1
          fi
          if cargo +1.97.1 check \
            --release \
            --manifest-path apps/desktop/core/Cargo.toml \
            --features score-storage-fault-injection; then
            echo "::error::A release build accepted the owner-only fault-injection feature."
            exit 1
          fi
      - name: Run Score Storage publication, retention, interruption, restart, inventory, receipt, durability, fault-recovery, write-failure, capacity-exhaustion, Windows ACL, Unix cleanup, and wiring regressions
        run: >-
          cargo +1.97.1 test
          --manifest-path apps/desktop/core/Cargo.toml
          --test score_pdf_attachment_publication
          --test score_pdf_retention_resolution
          --test score_pdf_interruption_recovery
          --test score_pdf_restart_readback
          --test score_pdf_recovery_inventory
          --test score_pdf_recovery_object_receipt
          --test score_pdf_success_durability
          --test score_pdf_fault_recovery
          --test score_pdf_write_failure_recovery
          --test score_pdf_capacity_exhaustion_recovery
          --test score_pdf_windows_acl_recovery
          --test score_pdf_unix_stage_cleanup_contract
          --test score_pdf_attachment_wiring
      - name: Run production-publisher process-termination recovery regression
        run: >-
          cargo +1.97.1 test
          --manifest-path apps/desktop/core/Cargo.toml
          --features score-storage-fault-injection
          --test score_pdf_process_termination_recovery
