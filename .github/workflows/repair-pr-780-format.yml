name: repair-pr-780-format

on:
  push:
    branches:
      - fix/codeql-action-consistency-v4-37-6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-780-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/codeql-action-consistency-v4-37-6
          fetch-depth: 1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v6.7.0
        with:
          version: "0.8.6"
          enable-cache: false

      - name: Format only the failing contract test
        shell: bash
        run: |
          set -euo pipefail
          uvx ruff@0.15.5 format \
            services/analysis-engine/tests/test_codeql_action_revision_contract.py
          changed="$(git diff --name-only)"
          test "$changed" = "services/analysis-engine/tests/test_codeql_action_revision_contract.py"
          uvx ruff@0.15.5 format --check \
            services/analysis-engine/tests/test_codeql_action_revision_contract.py

      - name: Commit the formatter result and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-780-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/analysis-engine/tests/test_codeql_action_revision_contract.py \
            .github/workflows/repair-pr-780-format.yml
          git diff --cached --check
          git commit -m "style(test): apply canonical Ruff formatting"
          git push origin HEAD:fix/codeql-action-consistency-v4-37-6
