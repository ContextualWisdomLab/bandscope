name: Repair PR 1007 selected-role handoff scope

on:
  push:
    branches:
      - feat/workspace-first-part-handoff
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/workspace-first-part-handoff
          fetch-depth: 0
      - name: Wire selected role and add workspace regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path("apps/desktop/src/features/workspace/Workspace.tsx")
          content = workspace.read_text(encoding="utf-8")
          old = "          <FirstPartHandoffCallout song={song} />"
          new = "          <FirstPartHandoffCallout song={song} activeRole={activeRole} />"
          if content.count(old) != 1:
              raise SystemExit("expected exactly one unscoped FirstPartHandoffCallout; refusing ambiguous repair")
          workspace.write_text(content.replace(old, new), encoding="utf-8")

          test_path = Path("apps/desktop/src/features/workspace/Workspace.part-handoff-role-scope.test.tsx")
          if test_path.exists():
              raise SystemExit(f"{test_path} already exists; refusing to overwrite concurrent work")
          test_path.write_text(
              '''import { createDemoRehearsalSong } from "@bandscope/shared-types";
          import { fireEvent, render, screen } from "@testing-library/react";
          import { afterEach, describe, expect, it } from "vitest";
          import { Workspace } from "./Workspace";
          import { createPartHandoffTransitionSong } from "./firstPartHandoff.test-fixture";

          const originalLanguage = navigator.language;

          /** Force a deterministic locale for buyer-visible workspace assertions. */
          function setNavigatorLanguage(language: string): void {
            Object.defineProperty(navigator, "language", { configurable: true, value: language });
          }

          afterEach(() => {
            setNavigatorLanguage(originalLanguage);
          });

          describe("Workspace selected-role first part handoff", () => {
            it("passes the selected role into the handoff resolver", () => {
              setNavigatorLanguage("en-US");
              const song = createPartHandoffTransitionSong();
              const demo = createDemoRehearsalSong();
              const unrelated = demo.sections
                .flatMap((section) => section.roles)
                .find((role) => role.id !== "bass-guitar" && role.id !== "lead-vocal");
              if (!unrelated) {
                throw new Error("Demo fixture must expose an unrelated role");
              }
              song.sections[0]!.roles.push(structuredClone(unrelated));

              render(<Workspace song={song} />);

              expect(
                screen.getByText("Bass Guitar still hands off to Lead Vocal in the chorus at 0:10.")
              ).toBeTruthy();

              fireEvent.click(screen.getByRole("tab", { name: unrelated.name }));
              expect(
                screen.getByText(
                  "Nothing still has a part handoff. Stay on tonight's map until a part owns a rehearsal-facing pass."
                )
              ).toBeTruthy();
              expect(
                screen.queryByRole("button", { name: "Open Bass Guitar handoff at 0:10" })
              ).toBeNull();

              fireEvent.click(screen.getByRole("tab", { name: "Lead Vocal" }));
              expect(
                screen.getByText("Bass Guitar still hands off to Lead Vocal in the chorus at 0:10.")
              ).toBeTruthy();

              fireEvent.click(screen.getByRole("tab", { name: "Bass Guitar" }));
              expect(
                screen.getByRole("button", { name: "Open Bass Guitar handoff at 0:10" })
              ).toBeTruthy();
            });
          });
          ''',
              encoding="utf-8",
          )
          PY
          rm .github/workflows/repair-pr1007-role-scope.yml
          git diff --check
          git diff -- apps/desktop/src/features/workspace/Workspace.tsx apps/desktop/src/features/workspace/Workspace.part-handoff-role-scope.test.tsx .github/workflows/repair-pr1007-role-scope.yml
      - name: Commit repair and retire one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/features/workspace/Workspace.tsx apps/desktop/src/features/workspace/Workspace.part-handoff-role-scope.test.tsx .github/workflows/repair-pr1007-role-scope.yml
          git commit -m "fix(workspace): scope first handoff to selected role"
          git push origin HEAD:feat/workspace-first-part-handoff