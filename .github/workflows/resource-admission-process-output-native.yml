name: resource-admission-process-output-native

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "apps/desktop/core/Cargo.toml"
      - "apps/desktop/core/src/root.rs"
      - "apps/desktop/core/src/lib.rs"
      - "apps/desktop/core/src/owned_process.rs"
      - "apps/desktop/core/src/process_output.rs"
      - "apps/desktop/core/tests/process_output_large_streams.rs"
      - "apps/desktop/core/tests/fixtures/process_output_test_helper.rs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/src/main.rs"
      - "apps/desktop/src-tauri/tests/analysis_process_terminal_containment_contract.rs"
      - "docs/doctoring/subprocess-containment.md"
      - "docs/doctoring/youtube-process-containment.md"
      - ".github/workflows/resource-admission-process-output-native.yml"
      - "services/analysis-engine/tests/test_resource_admission_process_output_workflow_policy.py"
  push:
    branches:
      - develop
      - main
    paths:
      - "apps/desktop/core/Cargo.toml"
      - "apps/desktop/core/src/root.rs"
      - "apps/desktop/core/src/lib.rs"
      - "apps/desktop/core/src/owned_process.rs"
      - "apps/desktop/core/src/process_output.rs"
      - "apps/desktop/core/tests/process_output_large_streams.rs"
      - "apps/desktop/core/tests/fixtures/process_output_test_helper.rs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/src/main.rs"
      - "apps/desktop/src-tauri/tests/analysis_process_terminal_containment_contract.rs"
      - "docs/doctoring/subprocess-containment.md"
      - "docs/doctoring/youtube-process-containment.md"
      - ".github/workflows/resource-admission-process-output-native.yml"
      - "services/analysis-engine/tests/test_resource_admission_process_output_workflow_policy.py"

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  process-output-large-streams:
    name: test / resource-admission / process-output / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run large stdout/stderr process-output contract
        run: cargo +1.97.1 test --manifest-path apps/desktop/core/Cargo.toml --features process_output_test_helper --test process_output_large_streams -- --nocapture
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.3"
          package-manager-cache: false
      - name: Activate pinned npm runtime
        run: corepack enable npm
      - name: Verify pinned npm runtime
        run: npm run check:npm-runtime
      - name: Install node dependencies
        run: npm ci
      - name: Build frontend prerequisite for Tauri context
        run: npm run build --workspace @bandscope/desktop
      - name: Run native analysis owned-process adapter contract
        run: cargo +1.97.1 test --manifest-path apps/desktop/src-tauri/Cargo.toml --test analysis_process_terminal_containment_contract -- --nocapture
