name: Fix handoff API format

on:
  push:
    branches: [feat/handoff-import-roundtrip]
    paths:
      - .github/workflows/fix-handoff-api-format.yml
  workflow_dispatch:

concurrency:
  group: fix-handoff-api-format
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  apply:
    if: github.repository == 'ContextualWisdomLab/bandscope' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/handoff-import-roundtrip
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen

      - name: Format and validate analysis API
        run: |
          set -euo pipefail
          uv run --project services/analysis-engine ruff format services/analysis-engine/src/bandscope_analysis/api.py
          uv run --project services/analysis-engine ruff check services/analysis-engine/src/bandscope_analysis/api.py
          uv run --project services/analysis-engine pytest services/analysis-engine/tests
          rm .github/workflows/fix-handoff-api-format.yml
          git diff --check

      - name: Commit formatting fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(analysis): format handoff API changes"
          git push origin HEAD:refs/heads/feat/handoff-import-roundtrip
