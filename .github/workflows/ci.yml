name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop
  EXPECTED_NPM_VERSION: "10.9.8"

jobs:
  lock-reproduction:
    name: gate / ci / npm-lock-reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Verify exact npm lockfile generator
        run: test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
      - name: Reproduce package lock without lifecycle execution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Preserve the exact generated lock as review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-lock-reproduction-${{ github.event.pull_request.head.sha || github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Reject lockfile drift
        run: git diff --exit-code -- package-lock.json

  verify:
    name: ci / build-and-test
    needs: lock-reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Verify exact npm lockfile generator
        run: test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Install node dependencies
        run: npm ci
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build and install Rust numeric extension
        run: |
          VENV_PY="$PWD/services/analysis-engine/.venv/bin/python"
          uvx maturin@1.9.6 build --release \
            --manifest-path services/analysis-engine/rust/Cargo.toml \
            --interpreter "$VENV_PY" \
            --out services/analysis-engine/rust/dist
          uv pip install --python "$VENV_PY" services/analysis-engine/rust/dist/*.whl
      - name: Run quickcheck
        run: ./scripts/harness/quickcheck.sh

  rust-check:
    name: gate / ci / rust-check
    needs: lock-reproduction
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Verify exact npm lockfile generator
        run: test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build --workspace @bandscope/desktop
      - name: Check Tauri shell
        run: cargo +stable check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Test Tauri shell
        run: cargo +stable test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
