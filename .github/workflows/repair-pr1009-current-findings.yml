name: Repair PR1009 current findings

on:
  push:
    branches:
      - feat/licensed-demo-first-run
    paths:
      - .github/repair-pr1009-current-findings.trigger

permissions:
  contents: write

concurrency:
  group: repair-pr1009-current-findings
  cancel-in-progress: true

jobs:
  repair_current_findings:
    if: ${{ github.repository == 'ContextualWisdomLab/bandscope' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/licensed-demo-first-run
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Revalidate exact live PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start_head=$(git rev-parse HEAD)
          live_head=$(gh api repos/${GITHUB_REPOSITORY}/pulls/1009 --jq .head.sha)
          test "$start_head" = "$live_head"
          echo "START_HEAD=$start_head" >> "$GITHUB_ENV"
      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          npm ci
          rustup toolchain install stable --profile minimal
      - name: Add regression-first tests and prove RED
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('' )).decode())"
          set +e
          npm --workspace @bandscope/desktop exec vitest run src/App.localSelectionConcurrency.test.tsx
          app_red_status=$?
          cargo test --manifest-path apps/desktop/core/Cargo.toml demo_audio_ -- --nocapture
          core_red_status=$?
          set -e
          test "$app_red_status" -ne 0
          test "$core_red_status" -ne 0
      - name: Implement minimal root-cause repair
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('' )).decode())"
      - name: Verify focused GREEN and formatting
        run: |
          set -euo pipefail
          npm --workspace @bandscope/desktop exec vitest run src/App.localSelectionConcurrency.test.tsx
          npm --workspace @bandscope/desktop exec tsc --noEmit
          cargo fmt --manifest-path apps/desktop/core/Cargo.toml -- --check
          cargo test --manifest-path apps/desktop/core/Cargo.toml demo_audio_ -- --nocapture
      - name: Commit repaired source and retire one-shot lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_head=$(gh api repos/${GITHUB_REPOSITORY}/pulls/1009 --jq .head.sha)
          test "$live_head" = "$START_HEAD"
          rm -f .github/workflows/repair-pr1009-current-findings.yml
          rm -f .github/repair-pr1009-current-findings.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx \
            apps/desktop/src/App.localSelectionConcurrency.test.tsx \
            apps/desktop/core/src/lib.rs \
            .github/workflows/repair-pr1009-current-findings.yml \
            .github/repair-pr1009-current-findings.trigger
          git commit -m "fix(activation): serialize intake and harden demo WAV"
          git push origin HEAD:feat/licensed-demo-first-run
