name: Repair PR1009 source-selection authority

on:
  push:
    branches:
      - feat/licensed-demo-first-run

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair_source_selection:
    name: repair-source-selection
    if: github.repository == 'ContextualWisdomLab/bandscope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/licensed-demo-first-run
      - name: Apply fail-closed source-selection authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("apps/desktop/src/App.tsx")
          app_text = app_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "  const demoSelectionInFlightRef = useRef(false);\n  const localSelectionInFlightRef = useRef(false);\n",
                  "  const sourceSelectionInFlightRef = useRef(false);\n",
              ),
              (
                  "  const handleStartAnalysis = async () => {\n    const submittedBootstrap = selectedBootstrap;\n",
                  "  const handleStartAnalysis = async () => {\n    if (analysisInFlight || isStarting || sourceSelectionInFlightRef.current) {\n      return;\n    }\n\n    const submittedBootstrap = selectedBootstrap;\n",
              ),
              (
                  "    if (\n      analysisInFlight ||\n      isStarting ||\n      isImporting ||\n      isSelectingDemo ||\n      localSelectionInFlightRef.current\n    ) {\n      return;\n    }\n\n    localSelectionInFlightRef.current = true;\n",
                  "    if (analysisInFlight || isStarting || sourceSelectionInFlightRef.current) {\n      return;\n    }\n\n    sourceSelectionInFlightRef.current = true;\n",
              ),
              (
                  "      setSelectedBootstrap(null);\n      setSelectedSourceKind(null);\n      setSelectionError(safeErrorDetail(selection.error.message, t(\"unsupportedLocalAudio\")));\n",
                  "      setSelectionError(safeErrorDetail(selection.error.message, t(\"unsupportedLocalAudio\")));\n",
              ),
              (
                  "    } finally {\n      localSelectionInFlightRef.current = false;\n      setIsSelectingLocal(false);\n    }\n  };\n\n  /** Validate the bundled licensed demo through the same local-audio bootstrap. */\n",
                  "    } finally {\n      sourceSelectionInFlightRef.current = false;\n      setIsSelectingLocal(false);\n    }\n  };\n\n  /** Validate the bundled licensed demo through the same local-audio bootstrap. */\n",
              ),
              (
                  "    if (analysisInFlight || isStarting || isImporting || demoSelectionInFlightRef.current) {\n      return;\n    }\n\n    demoSelectionInFlightRef.current = true;\n",
                  "    if (analysisInFlight || isStarting || sourceSelectionInFlightRef.current) {\n      return;\n    }\n\n    sourceSelectionInFlightRef.current = true;\n",
              ),
              (
                  "      setSelectedBootstrap(null);\n      setSelectedSourceKind(null);\n      setSelectionError(safeErrorDetail(selection.error.message, t(\"demoUnavailable\")));\n",
                  "      setSelectionError(safeErrorDetail(selection.error.message, t(\"demoUnavailable\")));\n",
              ),
              (
                  "    } finally {\n      demoSelectionInFlightRef.current = false;\n      setIsSelectingDemo(false);\n    }\n  };\n\n  /** Documented. */\n  const handleImportYoutube = async () => {\n    setSelectionError(null);\n",
                  "    } finally {\n      sourceSelectionInFlightRef.current = false;\n      setIsSelectingDemo(false);\n    }\n  };\n\n  /** Documented. */\n  const handleImportYoutube = async () => {\n    if (analysisInFlight || isStarting || sourceSelectionInFlightRef.current) {\n      return;\n    }\n\n    setSelectionError(null);\n",
              ),
              (
                  "    setIsImporting(true);\n    try {\n      const selection = await importYoutubeUrl(normalizedUrl);\n",
                  "    sourceSelectionInFlightRef.current = true;\n    setIsImporting(true);\n    try {\n      const selection = await importYoutubeUrl(normalizedUrl);\n",
              ),
              (
                  "    } finally {\n      setIsImporting(false);\n    }\n  };\n\n  /** Documented. */\n  const handleClearYoutubeUrl = () => {\n",
                  "    } finally {\n      sourceSelectionInFlightRef.current = false;\n      setIsImporting(false);\n    }\n  };\n\n  /** Documented. */\n  const handleClearYoutubeUrl = () => {\n",
              ),
              (
                  "                      {youtubeUrl && !analysisInFlight && !isStarting && !isImporting ? (\n",
                  "                      {youtubeUrl &&\n                      !analysisInFlight &&\n                      !isStarting &&\n                      !isImporting &&\n                      !isSelectingDemo &&\n                      !isSelectingLocal ? (\n",
              ),
              (
                  "                    disabled={!youtubeUrl || analysisInFlight || isStarting || isImporting}\n",
                  "                    disabled={\n                      !youtubeUrl ||\n                      analysisInFlight ||\n                      isStarting ||\n                      isImporting ||\n                      isSelectingDemo ||\n                      isSelectingLocal\n                    }\n",
              ),
              (
                  "                  disabled={analysisInFlight || isStarting || !selectedBootstrap || isImporting}\n",
                  "                  disabled={\n                    analysisInFlight ||\n                    isStarting ||\n                    !selectedBootstrap ||\n                    isImporting ||\n                    isSelectingDemo ||\n                    isSelectingLocal\n                  }\n",
              ),
          ]
          for old_text, new_text in replacements:
              match_count = app_text.count(old_text)
              if match_count != 1:
                  raise SystemExit(
                      f"App.tsx replacement cardinality mismatch ({match_count}): {old_text[:100]!r}"
                  )
              app_text = app_text.replace(old_text, new_text, 1)
          app_path.write_text(app_text, encoding="utf-8")
          PY
          git diff --check
          git config user.name "cwl-source-repair[bot]"
          git config user.email "cwl-source-repair[bot]@users.noreply.github.com"
          git add apps/desktop/src/App.tsx
          git rm .github/workflows/repair-pr1009-source-selection.yml
          git commit -m "fix(activation): serialize source selection authority"
          git push origin HEAD:feat/licensed-demo-first-run
