name: Repair PR 740 source-action lock

on:
  push:
    branches:
      - feat/handoff-import-roundtrip
    paths:
      - .github/workflows/repair-pr-740-source-lock.yml

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.ref == 'refs/heads/feat/handoff-import-roundtrip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: feat/handoff-import-roundtrip
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build and install Rust numeric extension
        run: |
          VENV_PY="$PWD/services/analysis-engine/.venv/bin/python"
          uvx maturin@1.9.6 build --release \
            --manifest-path services/analysis-engine/rust/Cargo.toml \
            --interpreter "$VENV_PY" \
            --out services/analysis-engine/rust/dist
          uv pip install --python "$VENV_PY" services/analysis-engine/rust/dist/*.whl
      - name: Prove the committed source-action regressions are red
        run: |
          set +e
          npm exec --workspace @bandscope/desktop -- vitest run src/App.source-action-lock.test.tsx
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected source-action lock regressions to fail before the production lock" >&2
            exit 1
          fi
      - name: Apply the minimal local-selection lock
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("apps/desktop/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  const [isImporting, setIsImporting] = useState(false);\n'
                  '  const [isReadingHandoff, setIsReadingHandoff] = useState(false);',
                  '  const [isImporting, setIsImporting] = useState(false);\n'
                  '  const [isSelectingLocalAudio, setIsSelectingLocalAudio] = useState(false);\n'
                  '  const [isReadingHandoff, setIsReadingHandoff] = useState(false);',
              ),
              (
                  '''  const handleChooseLocalAudio = async () => {\n'''
                  '''    setSelectionError(null);\n'''
                  '''    setSelectionErrorSource(null);\n'''
                  '''    const selection = await selectLocalAudioSource();\n'''
                  '''    if (selection.ok) {\n'''
                  '''      setSelectedBootstrap(selection.bootstrap);\n'''
                  '''      return;\n'''
                  '''    }\n\n'''
                  '''    setSelectedBootstrap(null);\n'''
                  '''    setSelectionError(safeErrorDetail(selection.error.message, t("unsupportedLocalAudio")));\n'''
                  '''    setSelectionErrorSource("local");\n'''
                  '''    setJobStatus(null);\n'''
                  '''  };''',
                  '''  const handleChooseLocalAudio = async () => {\n'''
                  '''    setSelectionError(null);\n'''
                  '''    setSelectionErrorSource(null);\n'''
                  '''    setIsSelectingLocalAudio(true);\n'''
                  '''    try {\n'''
                  '''      const selection = await selectLocalAudioSource();\n'''
                  '''      if (selection.ok) {\n'''
                  '''        setSelectedBootstrap(selection.bootstrap);\n'''
                  '''        return;\n'''
                  '''      }\n\n'''
                  '''      setSelectedBootstrap(null);\n'''
                  '''      setSelectionError(safeErrorDetail(selection.error.message, t("unsupportedLocalAudio")));\n'''
                  '''      setSelectionErrorSource("local");\n'''
                  '''      setJobStatus(null);\n'''
                  '''    } finally {\n'''
                  '''      setIsSelectingLocalAudio(false);\n'''
                  '''    }\n'''
                  '''  };''',
              ),
              (
                  '                      analysisInFlight || isStarting || isImporting || isReadingHandoff\n',
                  '                      analysisInFlight ||\n'
                  '                      isStarting ||\n'
                  '                      isSelectingLocalAudio ||\n'
                  '                      isImporting ||\n'
                  '                      isReadingHandoff\n',
              ),
              (
                  '                    disabled={analysisInFlight || isStarting || isImporting}\n',
                  '                    disabled={\n'
                  '                      analysisInFlight ||\n'
                  '                      isStarting ||\n'
                  '                      isSelectingLocalAudio ||\n'
                  '                      isImporting\n'
                  '                    }\n',
              ),
              (
                  '                      !isImporting &&\n                      !isReadingHandoff ? (',
                  '                      !isImporting &&\n'
                  '                      !isSelectingLocalAudio &&\n'
                  '                      !isReadingHandoff ? (',
              ),
              (
                  '                      isStarting ||\n                      isImporting ||\n                      isReadingHandoff\n',
                  '                      isStarting ||\n'
                  '                      isSelectingLocalAudio ||\n'
                  '                      isImporting ||\n'
                  '                      isReadingHandoff\n',
              ),
              (
                  '                    analysisInFlight ||\n                    isStarting ||\n                    !selectedBootstrap ||\n                    isImporting ||\n                    isReadingHandoff\n',
                  '                    analysisInFlight ||\n'
                  '                    isStarting ||\n'
                  '                    isSelectingLocalAudio ||\n'
                  '                    !selectedBootstrap ||\n'
                  '                    isImporting ||\n'
                  '                    isReadingHandoff\n',
              ),
          ]

          for old, new in replacements:
              count = app.count(old)
              if count < 1:
                  raise SystemExit(f"expected App.tsx replacement not found: {old[:80]!r}")
              app = app.replace(old, new)

          app_path.write_text(app, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          old = (
              "- Import a bounded, validated BandScope metadata-handoff JSON file, require an explicit "
              "fresh local-audio pairing, and reuse the handoff's focused rehearsal roles for reanalysis (#739)."
          )
          new = (
              old
              + " Competing local-audio, handoff, YouTube, and analysis actions remain locked while a local "
              "audio selection is pending, so the user's next source choice cannot be overwritten by a late async result."
          )
          if changelog.count(old) != 1:
              raise SystemExit("unexpected handoff changelog entry")
          changelog_path.write_text(changelog.replace(old, new), encoding="utf-8")
          PY
      - name: Verify focused source-action regressions
        run: |
          npm exec --workspace @bandscope/desktop -- vitest run \
            src/App.source-action-lock.test.tsx \
            src/App.handoff.test.tsx
          npm run --workspace @bandscope/desktop typecheck
          npm run --workspace @bandscope/desktop lint
      - name: Verify repository gate, self-delete, and push the green repair
        run: |
          ./scripts/harness/quickcheck.sh
          git config user.name "CWL repair bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/repair-pr-740-source-lock.yml
          git add CHANGELOG.md apps/desktop/src/App.tsx .github/workflows/repair-pr-740-source-lock.yml
          git commit -m "fix(ui): lock competing source actions"
          git push origin HEAD:feat/handoff-import-roundtrip
