name: Finalize handoff reading gate

on:
  push:
    branches: [feat/handoff-import-roundtrip]
    paths:
      - scripts/ci/finalize_handoff_reading_gate.py
      - .github/workflows/finalize-handoff-reading-gate.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
    paths:
      - scripts/ci/finalize_handoff_reading_gate.py
      - .github/workflows/finalize-handoff-reading-gate.yml
  workflow_dispatch:

concurrency:
  group: finalize-handoff-reading-gate
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'feat/handoff-import-roundtrip')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/handoff-import-roundtrip
          fetch-depth: 0

      - name: Use repository Node.js contract
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply reviewed source gate
        run: python3 scripts/ci/finalize_handoff_reading_gate.py

      - name: Validate desktop behavior
        run: |
          set -euo pipefail
          npm test --workspace @bandscope/desktop
          npm run lint --workspace @bandscope/desktop
          npm run typecheck --workspace @bandscope/desktop
          npm run build --workspace @bandscope/desktop
          git diff --check
          test ! -e scripts/ci/finalize_handoff_reading_gate.py
          test ! -e .github/workflows/finalize-handoff-reading-gate.yml

      - name: Commit reviewed fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(handoff): gate sources during validation"
          git push origin HEAD:refs/heads/feat/handoff-import-roundtrip

# A follow-up push activates this newly introduced one-shot workflow.
