name: dependency-review

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # GHSA-53q9-r3pm-6pq6 (torch<=2.2.2 torch.load RCE): torch 2.2.2 is the
          # last release with macOS Intel wheels, mandated by the cross-platform
          # build policy. torch.load only ever consumes demucs's pinned model
          # weights (never user-supplied data); untrusted audio does not reach
          # torch.load. Remove when the engine migrates off torch (ONNX) or the
          # Intel-mac mandate changes. See docs/security/dependency-policy.md.
          allow-ghsas: GHSA-53q9-r3pm-6pq6
