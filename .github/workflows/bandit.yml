name: bandit

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# Pull-request SAST is owned by the organization-required SAST Semgrep
# workflow. Keep Bandit as a trusted-branch/manual backstop without duplicating
# PR checkout, dependency installation, and Python scanning.
concurrency:
  group: bandit-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  bandit-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.6"
          enable-cache: false
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Run Bandit
        working-directory: services/analysis-engine
        run: uv run bandit -c pyproject.toml -r src
