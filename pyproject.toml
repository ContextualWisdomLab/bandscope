[project]
name = "bandscope-workspace"
version = "0.1.0"
description = "BandScope public GitHub workspace baseline"
requires-python = ">=3.12"
dependencies = []

[tool.bandscope]
analysis_service_path = "services/analysis-engine"
analysis_service_path_reason = "The current harness keeps the Python service under services/analysis-engine for uv-based verification; this is the effective equivalent of the requested services/analysis path."

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 100
exclude = ["setup.py", "docs", "build", ".venv", "services/analysis-engine/.venv"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 0
quiet = false
whitelist-regex = []
color = true
generate-badge = "."
badge-format = "svg"
