name: Hourly PR Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: bandscope-hourly-pr-maintenance
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  review-fix:
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@5983b41ace75040c1d81818171ca7d0f3653254e
    with:
      target_repository: ContextualWisdomLab/bandscope
      base_branch: "develop"
      max_prs: "50"
      max_dispatches: "3"
      retry_hours: "1"
      canonical_ref: "5983b41ace75040c1d81818171ca7d0f3653254e"
    secrets: inherit

  merge-queue:
    needs: review-fix
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-merge-scheduler.yml@5983b41ace75040c1d81818171ca7d0f3653254e
    with:
      base_branch: "develop"
      max_prs: "100"
      trigger_reviews: true
      review_dispatch_limit: "3"
      branch_update_limit: "3"
      enable_auto_merge: true
      merge_mode: direct_or_auto
      update_branches: true
      stale_opencode_minutes: "90"
      project_flow: git-flow
    secrets: inherit
