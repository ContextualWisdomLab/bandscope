name: Bootstrap naruon boundary hardening

on:
  push:
    branches: [feat/naruon-rehearsal-handoff-v1]
    paths:
      - scripts/ci/bootstrap_naruon_boundary_hardening.py
      - .github/workflows/bootstrap-naruon-boundary-hardening.yml
  workflow_dispatch:

concurrency:
  group: bootstrap-naruon-boundary-hardening
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope'
      && github.actor != 'github-actions[bot]'
      && github.ref_name == 'feat/naruon-rehearsal-handoff-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/naruon-rehearsal-handoff-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed trust-boundary hardening
        run: python3 scripts/ci/bootstrap_naruon_boundary_hardening.py

      - name: Verify generated hardening
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'const snapshot = snapshotBoundaryValue(value);' packages/shared-types/src/naruon.ts >/dev/null
          grep -F 'Invalid naruon rehearsal handoff JSON: malformed JSON' packages/shared-types/src/naruon.ts >/dev/null
          grep -F 'does not echo untrusted JSON fragments in parser errors' packages/shared-types/test/naruon-hardening.test.ts >/dev/null
          test ! -e scripts/ci/bootstrap_naruon_boundary_hardening.py
          test ! -e .github/workflows/bootstrap-naruon-boundary-hardening.yml

      - name: Commit generated hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "fix(naruon): snapshot validators and redact JSON errors"
          git push origin HEAD:refs/heads/feat/naruon-rehearsal-handoff-v1
