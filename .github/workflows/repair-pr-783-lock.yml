name: repair-pr-783-lock

on:
  push:
    branches:
      - fix/high-security-dependency-baseline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-pr-783-lock
  cancel-in-progress: false

jobs:
  regenerate-lock:
    name: regenerate canonical npm lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_NODE_VERSION: "v22.22.3"
      EXPECTED_NPM_VERSION: "10.9.8"
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/high-security-dependency-baseline
          fetch-depth: 1

      - name: Install the pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Verify the lock generator contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "$EXPECTED_NODE_VERSION"
          test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = json.loads(Path("package.json").read_text(encoding="utf-8"))
          desktop = json.loads(Path("apps/desktop/package.json").read_text(encoding="utf-8"))
          assert root["packageManager"] == "npm@10.9.8"
          assert root["devDependencies"]["undici"] == "7.29.0"
          assert root["overrides"]["undici"] == "$undici"
          assert desktop["dependencies"]["pdfjs-dist"] == "6.2.108"
          PY

      - name: Regenerate without lifecycle execution
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -z "$(git diff --name-only -- package.json apps/desktop/package.json)"

      - name: Verify generated dependency identities and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          packages = lock["packages"]
          assert lock["lockfileVersion"] == 3
          assert packages[""]["devDependencies"]["undici"] == "7.29.0"
          assert packages["apps/desktop"]["dependencies"]["pdfjs-dist"] == "6.2.108"
          assert packages["node_modules/undici"]["version"] == "7.29.0"
          assert packages["node_modules/pdfjs-dist"]["version"] == "6.2.108"
          PY
          npm audit --workspaces --audit-level=high

      - name: Commit the canonical artifact and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-783-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/repair-pr-783-lock.yml
          git diff --cached --check
          git commit -m "fix(deps): regenerate canonical npm 10.9.8 lock"
          git push origin HEAD:fix/high-security-dependency-baseline
