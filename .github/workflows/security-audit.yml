name: security-audit

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.8.6"
      - name: Install node dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --workspaces --audit-level=high
      - name: Sync Python dependencies
        run: uv sync --project services/analysis-engine --group dev --frozen
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.8.0
      - name: Export Python lock for audit
        working-directory: services/analysis-engine
        run: uv export --frozen --no-emit-project --format requirements-txt --no-hashes --output-file requirements-audit.txt
      - name: Audit Python dependencies
        working-directory: services/analysis-engine
        run: python -m pip_audit -r requirements-audit.txt --strict
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo +stable audit
