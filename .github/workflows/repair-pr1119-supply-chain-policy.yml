name: Repair PR1119 Trivy policy contract

on:
  push:
    branches:
      - fix/trivy-pr-code-scanning

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  repair_trivy_policy:
    name: repair-trivy-policy
    if: github.repository == 'ContextualWisdomLab/bandscope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/trivy-pr-code-scanning
      - name: Split push-only and PR-head local security contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy_test_path = Path("services/analysis-engine/tests/test_supply_chain_policy.py")
          policy_test_text = policy_test_path.read_text(encoding="utf-8")
          old_contract = '''def test_central_governance_workflows_are_push_only_where_local_signals_remain() -> None:
              """Ensure central PR governance keeps only repo-local push security signals."""
              repo_root = Path(__file__).resolve().parents[3]
              workflows_dir = repo_root / ".github" / "workflows"

              assert not (workflows_dir / "dependency-review.yml").exists()

              for local_signal in ("codeql.yml", "ossf-scorecard.yml", "trivy.yml"):
                  workflow = workflows_dir / local_signal
                  assert workflow.exists(), (
                      f"{local_signal} keeps repository-local security-tab/SAST signal "
                      "while central required workflows handle PR enforcement"
                  )
                  assert "pull_request:" not in workflow.read_text(encoding="utf-8")

              supply_chain = load_module(
                  "scripts/checks/verify_supply_chain.py", "verify_supply_chain_central"
              )
              required = {path.as_posix() for path in supply_chain.REQUIRED_FILES}
              assert ".github/workflows/dependency-review.yml" not in required
              assert ".github/workflows/codeql.yml" in required
              assert ".github/workflows/ossf-scorecard.yml" in required
          '''.replace("              ", "")
          new_contract = '''def test_central_governance_workflows_keep_local_signal_event_boundaries() -> None:
              """Ensure repository-local security signals use their intended event boundaries."""
              repo_root = Path(__file__).resolve().parents[3]
              workflows_dir = repo_root / ".github" / "workflows"

              assert not (workflows_dir / "dependency-review.yml").exists()

              for push_only_signal in ("codeql.yml", "ossf-scorecard.yml"):
                  workflow_path = workflows_dir / push_only_signal
                  assert workflow_path.exists(), (
                      f"{push_only_signal} keeps repository-local security-tab/SAST signal "
                      "while central required workflows handle PR enforcement"
                  )
                  assert "pull_request:" not in workflow_path.read_text(encoding="utf-8")

              trivy_workflow_path = workflows_dir / "trivy.yml"
              assert trivy_workflow_path.exists()
              trivy_workflow_text = trivy_workflow_path.read_text(encoding="utf-8")
              assert "pull_request:" in trivy_workflow_text
              assert "pull_request_target:" not in trivy_workflow_text

              supply_chain = load_module(
                  "scripts/checks/verify_supply_chain.py", "verify_supply_chain_central"
              )
              required_files = {path.as_posix() for path in supply_chain.REQUIRED_FILES}
              assert ".github/workflows/dependency-review.yml" not in required_files
              assert ".github/workflows/codeql.yml" in required_files
              assert ".github/workflows/ossf-scorecard.yml" in required_files
          '''.replace("              ", "")
          match_count = policy_test_text.count(old_contract)
          if match_count != 1:
              raise SystemExit(f"policy contract replacement cardinality mismatch: {match_count}")
          policy_test_path.write_text(policy_test_text.replace(old_contract, new_contract, 1), encoding="utf-8")
          PY
          git diff --check
          git config user.name "cwl-source-repair[bot]"
          git config user.email "cwl-source-repair[bot]@users.noreply.github.com"
          git add services/analysis-engine/tests/test_supply_chain_policy.py
          git rm --ignore-unmatch .github/repair-pr1119-supply-chain-policy.trigger
          git rm .github/workflows/repair-pr1119-supply-chain-policy.yml
          git commit -m "test(ci): separate Trivy PR-head policy contract"
          git push origin HEAD:fix/trivy-pr-code-scanning
