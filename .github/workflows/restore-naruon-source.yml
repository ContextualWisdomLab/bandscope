name: Restore naruon source

on:
  push:
    branches: [feat/naruon-rehearsal-handoff-v1]
    paths:
      - .github/workflows/restore-naruon-source.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
    paths:
      - .github/workflows/restore-naruon-source.yml
  workflow_dispatch:

concurrency:
  group: restore-naruon-source
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  restore:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'feat/naruon-rehearsal-handoff-v1')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch with history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/naruon-rehearsal-handoff-v1
          fetch-depth: 0

      - name: Use repository Node.js contract
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Restore last validated complete source
        run: |
          set -euo pipefail
          git show e12e4df8ddc8e72210eba3d44765f5a082e61d60:packages/shared-types/src/naruon.ts \
            > packages/shared-types/src/naruon.ts
          rm .github/workflows/restore-naruon-source.yml

      - name: Install and validate shared contract
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test --workspace @bandscope/shared-types
          npm run lint --workspace @bandscope/shared-types
          npm run typecheck --workspace @bandscope/shared-types
          git diff --check
          test ! -e .github/workflows/restore-naruon-source.yml

      - name: Commit restored source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(integration): restore validated naruon source"
          git push origin HEAD:refs/heads/feat/naruon-rehearsal-handoff-v1
