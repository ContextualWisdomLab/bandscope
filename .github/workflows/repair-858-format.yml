name: repair-858-format

on:
  push:
    branches:
      - fix/path-authority-boundary-852

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/bandscope' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/path-authority-boundary-852
          fetch-depth: 0
      - name: Format failing API and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.15.5'
          ruff format services/analysis-engine/src/bandscope_analysis/api.py
          git rm .github/workflows/repair-858-format.yml
          git add services/analysis-engine/src/bandscope_analysis/api.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Expected formatter or workflow cleanup change was absent.' >&2
            exit 1
          fi
          git commit -m 'style: format path authority API'
          git push origin HEAD:fix/path-authority-boundary-852
