name: Import PR 783 generated npm lock

on:
  push:
    branches:
      - fix/high-security-dependency-baseline
    paths:
      - .github/workflows/import-pr783-generated-lock.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: import-pr783-generated-lock
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop
  EXPECTED_SOURCE_HEAD: e2c0c2dfee35c19d1e9156ad0a7d9324fdefd1fb
  EXPECTED_NPM_VERSION: "10.9.8"
  ARTIFACT_ID: "8989562185"
  ARTIFACT_RUN_ID: "31161313485"
  ARTIFACT_NAME: npm-lock-reproduction-e2c0c2dfee35c19d1e9156ad0a7d9324fdefd1fb
  EXPECTED_LOCK_SHA256: 31dd2661eca864e3da46f86629a2535dc181d01449bd3a50fa3cdbd6c58e7971

jobs:
  import-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.ref == 'refs/heads/fix/high-security-dependency-baseline'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify bounded trigger lineage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_HEAD"
          mapfile -t trigger_delta < <(git diff --name-only "$EXPECTED_SOURCE_HEAD" HEAD)
          test "${#trigger_delta[@]}" -eq 1
          test "${trigger_delta[0]}" = ".github/workflows/import-pr783-generated-lock.yml"

      - name: Set up exact Node and npm generator
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Download exact head-bound lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
          mkdir -p "${RUNNER_TEMP}/pr783-lock"
          curl --fail --silent --show-error --location \
            --retry 0 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "${RUNNER_TEMP}/pr783-lock/artifact.zip"
          mapfile -t archive_entries < <(zipinfo -1 "${RUNNER_TEMP}/pr783-lock/artifact.zip")
          test "${#archive_entries[@]}" -eq 1
          test "${archive_entries[0]}" = "package-lock.json"
          unzip -p "${RUNNER_TEMP}/pr783-lock/artifact.zip" package-lock.json \
            > "${RUNNER_TEMP}/pr783-lock/package-lock.json"
          test "$(sha256sum "${RUNNER_TEMP}/pr783-lock/package-lock.json" | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA256"
          mv "${RUNNER_TEMP}/pr783-lock/package-lock.json" package-lock.json

      - name: Verify exact generated lock and security baseline
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA256"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA256"
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --workspaces --audit-level=high
          npm run typecheck --workspace @bandscope/desktop
          npm run lint --workspace @bandscope/desktop
          npm exec --workspace @bandscope/desktop vitest run \
            src/features/score/pdfjs.test.ts \
            --coverage=false
          git diff --check

      - name: Remove one-shot importer and publish verified lock
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/high-security-dependency-baseline
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/workflows/import-pr783-generated-lock.yml
          test "$(git diff --name-only "$EXPECTED_SOURCE_HEAD" -- | sort)" = "package-lock.json"
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA256"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/import-pr783-generated-lock.yml
          git diff --cached --check
          git commit -m "fix(security): import verified npm 10.9.8 lock"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
