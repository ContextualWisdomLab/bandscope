name: Repair score PDF PR scope

on:
  push:
    branches:
      - bolt/optimize-score-pdf-read-14940922715415907974
    paths:
      - .github/workflows/repair-score-pdf-pr.yml

concurrency:
  group: repair-score-pdf-pr-729
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout guarded PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Repair unrelated coverage and lock drift
        env:
          EXPECTED_PARENT_SHA: b58dc6ad72e5d33b8b50bbc4519500be0f2bb51c
          EXPECTED_FEATURE_SHA: f5d7be12529b7e109ceef866c05566310d97a002
          BASE_SHA: acdbea6344fe1231c39535b575f4de35e4c607c9
          CANONICAL_LOCK_SHA: 87b3455bc84c8aa2a69550991de289e3c4ec92d6
          CANONICAL_LOCK_BRANCH: feat/i18n-workspace-buttons-12938137214845538471
          REPAIR_WORKFLOW: .github/workflows/repair-score-pdf-pr.yml
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_FEATURE_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT_SHA"...HEAD)" = "$REPAIR_WORKFLOW"

          git fetch --no-tags origin \
            "+refs/heads/${CANONICAL_LOCK_BRANCH}:refs/remotes/origin/${CANONICAL_LOCK_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${CANONICAL_LOCK_BRANCH}")" = "$CANONICAL_LOCK_SHA"

          python3 - <<'PY'
          import json
          import os
          import subprocess

          base_sha = os.environ["BASE_SHA"]
          canonical_sha = os.environ["CANONICAL_LOCK_SHA"]

          def load_lock(sha: str) -> dict:
              payload = subprocess.check_output(
                  ["git", "show", f"{sha}:package-lock.json"], text=True
              )
              value = json.loads(payload)
              if not isinstance(value, dict):
                  raise SystemExit("package-lock.json must contain a JSON object")
              return value

          base = load_lock(base_sha)
          canonical = load_lock(canonical_sha)
          base_undici = base["packages"]["node_modules/undici"]
          canonical_undici = canonical["packages"]["node_modules/undici"]

          expected_changed_keys = {"version", "resolved", "integrity"}
          changed_keys = {
              key
              for key in set(base_undici) | set(canonical_undici)
              if base_undici.get(key) != canonical_undici.get(key)
          }
          if changed_keys != expected_changed_keys:
              raise SystemExit(
                  f"canonical lock changes unexpected undici fields: {sorted(changed_keys)}"
              )
          if canonical_undici.get("version") != "7.29.0":
              raise SystemExit("canonical lock must pin undici 7.29.0")

          normalized = json.loads(json.dumps(canonical))
          normalized["packages"]["node_modules/undici"] = base_undici
          if normalized != base:
              raise SystemExit("canonical lock contains changes beyond the bounded undici update")
          PY

          git show "$BASE_SHA:apps/desktop/package.json" > apps/desktop/package.json
          git show "$CANONICAL_LOCK_SHA:package-lock.json" > package-lock.json
          rm -f \
            apps/desktop/package-lock.json \
            apps/desktop/scripts/sync_coverage_lock.mjs \
            apps/desktop/src/shared-types-proxy.ts \
            "$REPAIR_WORKFLOW"

          python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          assert lock["packages"]["node_modules/undici"]["version"] == "7.29.0"
          assert not Path("apps/desktop/package-lock.json").exists()
          assert not Path("apps/desktop/scripts/sync_coverage_lock.mjs").exists()
          assert not Path("apps/desktop/src/shared-types-proxy.ts").exists()
          PY

          git diff --check
          actual_files="$(git diff --name-only "$BASE_SHA" -- | sort)"
          expected_files="$(printf '%s\n' \
            apps/desktop/src/features/score/scoreStorage.test.ts \
            apps/desktop/src/features/score/scoreStorage.ts \
            package-lock.json | sort)"
          test "$actual_files" = "$expected_files"

      - name: Install and audit workspace dependencies
        run: |
          set -euo pipefail
          npm ci
          npm audit --workspaces --audit-level=high

      - name: Verify desktop byte contract
        run: |
          set -euo pipefail
          npm --workspace apps/desktop run lint
          npm --workspace apps/desktop run typecheck
          npm --workspace apps/desktop test
          npm --workspace apps/desktop run build

      - name: Commit verified repair
        env:
          BASE_SHA: acdbea6344fe1231c39535b575f4de35e4c607c9
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          actual_files="$(git diff --cached --name-only | sort)"
          expected_files="$(printf '%s\n' \
            .github/workflows/repair-score-pdf-pr.yml \
            apps/desktop/package-lock.json \
            apps/desktop/package.json \
            apps/desktop/scripts/sync_coverage_lock.mjs \
            apps/desktop/src/shared-types-proxy.ts \
            package-lock.json | sort)"
          test "$actual_files" = "$expected_files"
          git commit -m "fix(score): remove coverage workaround and restore secure root lock"
          test "$(git diff --name-only "$BASE_SHA"...HEAD | sort)" = "$(printf '%s\n' \
            apps/desktop/src/features/score/scoreStorage.test.ts \
            apps/desktop/src/features/score/scoreStorage.ts \
            package-lock.json | sort)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
