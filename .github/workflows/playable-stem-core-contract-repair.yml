name: playable-stem-core-contract-repair

on:
  push:
    branches:
      - feat/playable-stem-native-contract-961
    paths:
      - scripts/repairs/apply_playable_stem_core_modules.py
      - .github/workflows/playable-stem-core-contract-repair.yml

permissions:
  contents: write

concurrency:
  group: playable-stem-core-contract-repair-${{ github.repository }}-1160
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify exact branch identity
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "feat/playable-stem-native-contract-961"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install reviewed Rust toolchain
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy
      - name: Apply exact crate-root repair
        run: python scripts/repairs/apply_playable_stem_core_modules.py
      - name: Check Rust formatting
        run: |
          cargo +1.97.1 fmt \
            --manifest-path apps/desktop/core/Cargo.toml \
            --all \
            -- \
            --check
      - name: Test complete desktop core
        run: |
          cargo +1.97.1 test \
            --manifest-path apps/desktop/core/Cargo.toml \
            --locked
      - name: Reject every Clippy warning
        run: |
          cargo +1.97.1 clippy \
            --manifest-path apps/desktop/core/Cargo.toml \
            --all-targets \
            --locked \
            -- \
            -D warnings
      - name: Verify source diff integrity
        run: git diff --check
      - name: Remove completed repair machinery
        run: |
          rm scripts/repairs/apply_playable_stem_core_modules.py
          rm .github/workflows/playable-stem-core-contract-repair.yml
      - name: Commit verified core integration
        shell: bash
        run: |
          git config user.name "bandscope-repair-bot"
          git config user.email "bandscope-repair-bot@users.noreply.github.com"
          git add \
            apps/desktop/core/src/lib.rs \
            apps/desktop/core/src/analysis_process_status.rs \
            apps/desktop/core/src/playable_stem_contract.rs \
            apps/desktop/core/tests/analysis_process_status.rs \
            apps/desktop/core/tests/playable_stem_artifact_reference.rs \
            scripts/repairs/apply_playable_stem_core_modules.py \
            .github/workflows/playable-stem-core-contract-repair.yml
          git diff --cached --quiet && { echo "No verified core delta was produced." >&2; exit 1; }
          git commit -m "feat(core): publish playable stem process contracts"
          git push origin HEAD:feat/playable-stem-native-contract-961
