name: Bootstrap desktop coverage lock

on:
  push:
    branches: [bolt/optimize-score-pdf-read-14940922715415907974]
    paths:
      - scripts/ci/bootstrap_desktop_coverage_lock.py
      - .github/workflows/bootstrap-desktop-coverage-lock.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
    paths:
      - scripts/ci/bootstrap_desktop_coverage_lock.py
      - .github/workflows/bootstrap-desktop-coverage-lock.yml
  workflow_dispatch:

concurrency:
  group: bootstrap-desktop-coverage-lock
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: develop

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/bandscope' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'bolt/optimize-score-pdf-read-14940922715415907974')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: bolt/optimize-score-pdf-read-14940922715415907974
          fetch-depth: 0

      - name: Use repository Node.js contract
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: Apply reviewed coverage-lock contract
        run: |
          set -euo pipefail
          python3 scripts/ci/bootstrap_desktop_coverage_lock.py
          node apps/desktop/scripts/sync_coverage_lock.mjs --write

      - name: Seed exact root dependency cache
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate standalone lifecycle-disabled desktop coverage
        run: |
          set -euo pipefail
          rm -rf apps/desktop/node_modules
          (
            cd apps/desktop
            npm ci --offline --ignore-scripts --no-audit --no-fund
            npm test
          )

      - name: Verify deterministic synchronization and commit
        run: |
          set -euo pipefail
          node apps/desktop/scripts/sync_coverage_lock.mjs --check
          git diff --check
          test ! -e scripts/ci/bootstrap_desktop_coverage_lock.py
          test ! -e .github/workflows/bootstrap-desktop-coverage-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): make desktop coverage install self-contained"
          git push origin HEAD:refs/heads/bolt/optimize-score-pdf-read-14940922715415907974
